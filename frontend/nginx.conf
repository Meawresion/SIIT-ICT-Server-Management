# The React build behind the ALB (production image). /api/* never reaches nginx: the ALB sends it
# to the backend.

# One JSON line per request, like the backend's logs (on AWS they go to CloudWatch, then S3). The
# path is the one asked for, without the query string; the client address comes from the ALB.
map $request_uri $request_path {
    ~^(?<p>[^?]*) $p;
}
log_format json escape=json '{"ts":"$time_iso8601","level":"info","event":"http.request","source":"frontend",'
    '"method":"$request_method","path":"$request_path","status":$status,"bytes":$body_bytes_sent,'
    '"ms":$request_time,"ip":"$http_x_forwarded_for","agent":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout json;

    # Plain pages without server details (the app's own routes are handled by React).
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;
    location /errors/ {
        internal;
        add_header Cache-Control "no-store";
    }

    # File names under assets/ change with their content, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Client-side routes (/requests, /review, ...) all get index.html; the browser always
    # revalidates it, so a new deploy shows up on the next page load.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri /index.html;
    }
}
