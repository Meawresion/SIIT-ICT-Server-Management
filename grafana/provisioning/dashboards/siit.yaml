# The dashboards in /var/lib/grafana/dashboards (grafana/dashboards in the repo, with the project
# name filled in by entrypoint.sh), read-only.
apiVersion: 1
providers:
  - name: siit
    folder: SIIT
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
