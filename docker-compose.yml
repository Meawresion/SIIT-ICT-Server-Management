services:
  mysql:
    image: mysql:8
    container_name: siit_mysql
    environment:
      # root is the admin user (schema, init.sql); the backend connects as MYSQL_USER, which the
      # image creates on the first start; privileges.sh then limits it to the app's tables, with
      # only SELECT and INSERT on the request_event audit log (FR-9.1).
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/privileges.sh:/docker-entrypoint-initdb.d/privileges.sh
      - mysql_data:/var/lib/mysql
    networks:
      - siit-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: siit_backend
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS}
      FRONTEND_URL: ${FRONTEND_URL}
      STUDENT_EMAIL_DOMAIN: ${STUDENT_EMAIL_DOMAIN}
      STUDENT_ID_DIGITS: ${STUDENT_ID_DIGITS}
      DEGREE_EMAIL_PREFIXES: ${DEGREE_EMAIL_PREFIXES}
      STAFF_EMAIL_DOMAINS: ${STAFF_EMAIL_DOMAINS}
      # Provisioning through acc-prov-vm; off while MESSAGE_TRANSPORT is empty.
      MESSAGE_TRANSPORT: ${MESSAGE_TRANSPORT:-}
      AMQP_URL: amqp://activemq:5672
      AMQP_USER: ${ARTEMIS_USER}
      AMQP_PASSWORD: ${ARTEMIS_PASSWORD}
      AMQP_REQUEST_QUEUE: ${AMQP_REQUEST_QUEUE:-}
      AMQP_RESULT_QUEUE: ${AMQP_RESULT_QUEUE:-}
      AMQP_DEAD_LETTER_QUEUE: ${AMQP_DEAD_LETTER_QUEUE:-}
      MSG_PRIVATE_KEY: ${MSG_PRIVATE_KEY:-}
      MSG_PEER_PUBLIC_KEYS: ${MSG_PEER_PUBLIC_KEYS:-}
      MSG_JOB_TTL_SEC: ${MSG_JOB_TTL_SEC:-}
      MSG_MAX_TTL_SEC: ${MSG_MAX_TTL_SEC:-}
      GPU_NODES: ${GPU_NODES:-}
      OVPN_PROFILE_URL: ${OVPN_PROFILE_URL:-}
      MANUAL_GPU_URL: ${MANUAL_GPU_URL:-}
      # Status emails; only logged while SMTP_HOST is empty.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      # Scheduler; empty values take the defaults.
      SCHEDULER_INTERVAL_SEC: ${SCHEDULER_INTERVAL_SEC:-}
      EXPIRY_REMINDER_DAYS: ${EXPIRY_REMINDER_DAYS:-}
      SITE_TIME_ZONE: ${SITE_TIME_ZONE:-}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    networks:
      - siit-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: siit_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - siit-network
    command: npm run dev -- --host 0.0.0.0

  # Local message broker for backend <-> acc-prov-vm (D23), instead of SQS. Messages are
  # signed and encrypted by the apps (D22). Ports are bound to 127.0.0.1 only.
  activemq:
    image: apache/artemis:2.57.0
    container_name: siit_activemq
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      ANONYMOUS_LOGIN: "false"
    ports:
      - "127.0.0.1:5672:5672"   # AMQP 1.0
      - "127.0.0.1:8161:8161"   # web console
    volumes:
      - activemq_data:/var/lib/artemis-instance
    networks:
      - siit-network

volumes:
  mysql_data:
  activemq_data:

networks:
  siit-network:
    driver: bridge
