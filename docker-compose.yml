services:
  mysql:
    image: mysql:8
    container_name: siit_mysql
    environment:
      # root is the admin user (schema, init.sql); the backend connects as MYSQL_USER, which the
      # image creates on the first start with rights on MYSQL_DATABASE only.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - siit-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siit_backend
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      STUDENT_EMAIL_DOMAIN: ${STUDENT_EMAIL_DOMAIN}
      STUDENT_ID_DIGITS: ${STUDENT_ID_DIGITS}
      DEGREE_EMAIL_PREFIXES: ${DEGREE_EMAIL_PREFIXES}
      STAFF_EMAIL_DOMAINS: ${STAFF_EMAIL_DOMAINS}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    networks:
      - siit-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siit_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - siit-network
    command: npm run dev -- --host 0.0.0.0

  # Local message broker for backend <-> acc-prov-vm (D23), instead of SQS. Messages are
  # signed and encrypted by the apps (D22). Ports are bound to 127.0.0.1 only.
  activemq:
    image: apache/artemis:2.57.0
    container_name: siit_activemq
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      ANONYMOUS_LOGIN: "false"
    ports:
      - "127.0.0.1:5672:5672"   # AMQP 1.0
      - "127.0.0.1:8161:8161"   # web console
    volumes:
      - activemq_data:/var/lib/artemis-instance
    networks:
      - siit-network

volumes:
  mysql_data:
  activemq_data:

networks:
  siit-network:
    driver: bridge
