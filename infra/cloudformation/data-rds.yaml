AWSTemplateFormatVersion: '2010-09-09'
Description: 'Database: RDS MySQL 8.4 Multi-AZ, private subnets, TLS, backups; snapshot on delete.'

Parameters:
  Project:
    Type: String
    Default: siit
  LogsStack:
    Type: String
    Description: Logs stack
  NetworkStack:
    Type: String
  PlatformStack:
    Type: String
  ImageTag:
    Type: String
    Description: DB init image tag
  DbName:
    Type: String
    Default: siit_resource
  InstanceClass:
    Type: String
    Default: db.t3.micro
  MultiAz:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  AllocatedStorage:
    Type: Number
    Default: 20
    Description: GiB (gp3)
  MaxAllocatedStorage:
    Type: Number
    Default: 50
  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Backup retention days
  CopyFromStack:
    Type: String
    Default: ''
    Description: Data stack to copy from; empty = none
  RestoreSnapshot:
    Type: String
    Default: ''
    Description: Snapshot to restore; empty = new database

Conditions:
  Copy: !Not [!Equals [!Ref CopyFromStack, '']]
  Restore: !Not [!Equals [!Ref RestoreSnapshot, '']]

Resources:
  IdentityDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${Project} identity service DB user'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${Project}_identity"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
  RequestsDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${Project} requests service DB user'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${Project}_requests"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
  ProvisioningDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${Project} provisioning service DB user'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${Project}_provisioning"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS MySQL (3306 only from the backend tasks and the init task)
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStack}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub '${PlatformStack}-BackendSecurityGroupId'
          Description: Backend tasks
      Tags:
        - Key: Name
          Value: !Sub '${Project}-rds'

  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub '${Project} RDS (private subnets, 2 AZs)'
      SubnetIds: !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PrivateSubnets'}]

  ParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Sub '${Project} MySQL 8.4'
      Family: mysql8.4
      Parameters:
        require_secure_transport: '1'
        log_bin_trust_function_creators: '1'

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      EngineVersion: '8.4'
      AutoMinorVersionUpgrade: true
      DBInstanceClass: !Ref InstanceClass
      MultiAZ: !Ref MultiAz
      AllocatedStorage: !Ref AllocatedStorage
      MaxAllocatedStorage: !Ref MaxAllocatedStorage
      StorageType: gp3
      DBSnapshotIdentifier: !If [Restore, !Ref RestoreSnapshot, !Ref AWS::NoValue]
      StorageEncrypted: !If [Restore, !Ref AWS::NoValue, true]
      DBName: !If [Restore, !Ref AWS::NoValue, !Ref DbName]
      MasterUsername: !If [Restore, !Ref AWS::NoValue, dbadmin]
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref SubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      DBParameterGroupName: !Ref ParameterGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: !Ref BackupRetentionDays
      DeleteAutomatedBackups: true
      CopyTagsToSnapshot: true
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub '${Project}-db'

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-db-init-exec'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-task
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Project}-mysql'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${Project}/mysql:*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt DbInstance.MasterUserSecret.SecretArn
                  - !Ref IdentityDbSecret
                  - !Ref RequestsDbSecret
                  - !Ref ProvisioningDbSecret
                  - !If
                    - Copy
                    - Fn::ImportValue: !Sub '${CopyFromStack}-DbRootSecretArn'
                    - !Ref AWS::NoValue
  InitTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Project}-db-init'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: rds-init
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo:
                Fn::ImportValue: !Sub '${PlatformStack}-MysqlRepositoryUri'
          Essential: true
          Command: [bash, /usr/local/bin/rds-init.sh]
          Environment:
            - Name: DB_HOST
              Value: !GetAtt DbInstance.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt DbInstance.Endpoint.Port
            - Name: MYSQL_DATABASE
              Value: !Ref DbName
            - Name: IDENTITY_DB_USER
              Value: !Sub '${Project}_identity'
            - Name: REQUESTS_DB_USER
              Value: !Sub '${Project}_requests'
            - Name: PROVISIONING_DB_USER
              Value: !Sub '${Project}_provisioning'
            - !If
              - Copy
              - Name: SOURCE_DB_HOST
                Value:
                  Fn::ImportValue: !Sub '${CopyFromStack}-DbHost'
              - !Ref AWS::NoValue
          Secrets:
            - Name: DB_ADMIN_USER
              ValueFrom: !Sub '${DbInstance.MasterUserSecret.SecretArn}:username::'
            - Name: DB_ADMIN_PASSWORD
              ValueFrom: !Sub '${DbInstance.MasterUserSecret.SecretArn}:password::'
            - Name: IDENTITY_DB_PASSWORD
              ValueFrom: !Sub '${IdentityDbSecret}:password::'
            - Name: REQUESTS_DB_PASSWORD
              ValueFrom: !Sub '${RequestsDbSecret}:password::'
            - Name: PROVISIONING_DB_PASSWORD
              ValueFrom: !Sub '${ProvisioningDbSecret}:password::'
            - !If
              - Copy
              - Name: SOURCE_DB_PASSWORD
                ValueFrom: !Sub
                  - '${Arn}:password::'
                  - Arn:
                      Fn::ImportValue: !Sub '${CopyFromStack}-DbRootSecretArn'
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${LogsStack}-MysqlLogGroup'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: db-init

  StorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-db-storage-low'
      AlarmDescription: RDS free storage below 2 GiB
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DbInstance
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-db-cpu-high'
      AlarmDescription: RDS CPU above 80% for 15 minutes
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DbInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]

Outputs:
  DbHost:
    Value: !GetAtt DbInstance.Endpoint.Address
    Export:
      Name: !Sub '${AWS::StackName}-DbHost'
  DbPort:
    Value: !GetAtt DbInstance.Endpoint.Port
    Export:
      Name: !Sub '${AWS::StackName}-DbPort'
  DbName:
    Value: !Ref DbName
    Export:
      Name: !Sub '${AWS::StackName}-DbName'
  DbTls:
    Description: DB TLS mode
    Value: verify
    Export:
      Name: !Sub '${AWS::StackName}-DbTls'
  IdentityDbSecretArn:
    Value: !Ref IdentityDbSecret
    Export:
      Name: !Sub '${AWS::StackName}-IdentityDbSecretArn'
  RequestsDbSecretArn:
    Value: !Ref RequestsDbSecret
    Export:
      Name: !Sub '${AWS::StackName}-RequestsDbSecretArn'
  ProvisioningDbSecretArn:
    Value: !Ref ProvisioningDbSecret
    Export:
      Name: !Sub '${AWS::StackName}-ProvisioningDbSecretArn'
  DbInstanceId:
    Value: !Ref DbInstance
  InitTaskDefinitionArn:
    Value: !Ref InitTaskDefinition
  DbAdminSecretArn:
    Description: RDS admin secret
    Value: !GetAtt DbInstance.MasterUserSecret.SecretArn
