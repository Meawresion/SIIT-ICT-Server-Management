AWSTemplateFormatVersion: '2010-09-09'
Description: 'ACM certificate for the zone and its wildcard, validated through DNS (us-east-1).'

Parameters:
  DnsStack:
    Type: String
    Description: DNS stack

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName:
        Fn::ImportValue: !Sub '${DnsStack}-ZoneName'
      SubjectAlternativeNames:
        - !Sub
          - '*.${Zone}'
          - Zone:
              Fn::ImportValue: !Sub '${DnsStack}-ZoneName'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName:
            Fn::ImportValue: !Sub '${DnsStack}-ZoneName'
          HostedZoneId:
            Fn::ImportValue: !Sub '${DnsStack}-HostedZoneId'

Outputs:
  CertificateArn:
    Value: !Ref Certificate
    Export:
      Name: !Sub '${AWS::StackName}-CertificateArn'
