AWSTemplateFormatVersion: '2010-09-09'
Description: 'Budget database: MySQL 8.4 as one ECS task on EFS behind an internal NLB.'

Parameters:
  Project:
    Type: String
    Default: siit
  LogsStack:
    Type: String
    Description: Logs stack
  NetworkStack:
    Type: String
  PlatformStack:
    Type: String
  ImageTag:
    Type: String
    Description: MySQL image tag
  DbName:
    Type: String
    Default: siit_resource
  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues: [0, 1]
    Description: 0 or 1
  Cpu:
    Type: String
    Default: '512'
  Memory:
    Type: String
    Default: '1024'

Resources:
  IdentityDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${Project} identity service DB user'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${Project}_identity"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
  RequestsDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${Project} requests service DB user'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${Project}_requests"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
  ProvisioningDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${Project} provisioning service DB user'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${Project}_provisioning"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
  DbRootSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${Project} MySQL root'
      GenerateSecretString:
        SecretStringTemplate: '{"username":"root"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DbLbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal MySQL load balancer (3306 only from the backend tasks)
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStack}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub '${PlatformStack}-BackendSecurityGroupId'
          Description: Backend tasks
      Tags:
        - Key: Name
          Value: !Sub '${Project}-mysql-lb'
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MySQL task (3306 only from its load balancer)
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStack}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref DbLbSecurityGroup
          Description: Internal load balancer (traffic and health checks)
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: ECR image pull, EFS, CloudWatch Logs
      Tags:
        - Key: Name
          Value: !Sub '${Project}-mysql'
  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EFS mount targets (NFS only from the MySQL task)
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStack}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref DbSecurityGroup
          Description: MySQL task
      Tags:
        - Key: Name
          Value: !Sub '${Project}-efs'

  FileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: !Sub '${Project}-mysql-data'
  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Select [0, !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PrivateSubnets'}]]
      SecurityGroups: [!Ref EfsSecurityGroup]
  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Select [1, !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PrivateSubnets'}]]
      SecurityGroups: [!Ref EfsSecurityGroup]
  AccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser:
        Uid: '999'
        Gid: '999'
      RootDirectory:
        Path: /mysql
        CreationInfo:
          OwnerUid: '999'
          OwnerGid: '999'
          Permissions: '750'

  DbLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${Project}-db'
      Type: network
      Scheme: internal
      Subnets: !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PrivateSubnets'}]
      SecurityGroups: [!Ref DbLbSecurityGroup]
  DbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: TCP
      Port: 3306
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStack}-VpcId'
      HealthCheckProtocol: TCP
      HealthCheckIntervalSeconds: 30
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '10'
  DbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref DbLoadBalancer
      Protocol: TCP
      Port: 3306
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref DbTargetGroup

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-mysql-exec'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-task
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Project}-mysql'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${Project}/mysql:*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DbRootSecret, !Ref IdentityDbSecret, !Ref RequestsDbSecret, !Ref ProvisioningDbSecret]
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Project}-mysql'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref AccessPoint
              IAM: DISABLED
      ContainerDefinitions:
        - Name: mysql
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo:
                Fn::ImportValue: !Sub '${PlatformStack}-MysqlRepositoryUri'
          Essential: true
          Command: ['--innodb-use-native-aio=0', '--skip-name-resolve', '--host-cache-size=0']
          PortMappings:
            - ContainerPort: 3306
              Protocol: tcp
          Environment:
            - Name: MYSQL_DATABASE
              Value: !Ref DbName
            - Name: IDENTITY_DB_USER
              Value: !Sub '${Project}_identity'
            - Name: REQUESTS_DB_USER
              Value: !Sub '${Project}_requests'
            - Name: PROVISIONING_DB_USER
              Value: !Sub '${Project}_provisioning'
          Secrets:
            - Name: MYSQL_ROOT_PASSWORD
              ValueFrom: !Sub '${DbRootSecret}:password::'
            - Name: IDENTITY_DB_PASSWORD
              ValueFrom: !Sub '${IdentityDbSecret}:password::'
            - Name: REQUESTS_DB_PASSWORD
              ValueFrom: !Sub '${RequestsDbSecret}:password::'
            - Name: PROVISIONING_DB_PASSWORD
              ValueFrom: !Sub '${ProvisioningDbSecret}:password::'
          MountPoints:
            - SourceVolume: data
              ContainerPath: /var/lib/mysql
          HealthCheck:
            Command: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --silent || exit 1']
            Interval: 15
            Timeout: 5
            Retries: 5
            StartPeriod: 180
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${LogsStack}-MysqlLogGroup'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mysql

  Service:
    Type: AWS::ECS::Service
    DependsOn: [MountTargetA, MountTargetB, DbListener]
    Properties:
      ServiceName: mysql
      Cluster:
        Fn::ImportValue: !Sub '${PlatformStack}-ClusterName'
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 300
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PublicSubnets'}]
          SecurityGroups: [!Ref DbSecurityGroup]
      LoadBalancers:
        - ContainerName: mysql
          ContainerPort: 3306
          TargetGroupArn: !Ref DbTargetGroup

Outputs:
  DbHost:
    Value: !GetAtt DbLoadBalancer.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-DbHost'
  DbPort:
    Value: '3306'
    Export:
      Name: !Sub '${AWS::StackName}-DbPort'
  DbName:
    Value: !Ref DbName
    Export:
      Name: !Sub '${AWS::StackName}-DbName'
  IdentityDbSecretArn:
    Value: !Ref IdentityDbSecret
    Export:
      Name: !Sub '${AWS::StackName}-IdentityDbSecretArn'
  RequestsDbSecretArn:
    Value: !Ref RequestsDbSecret
    Export:
      Name: !Sub '${AWS::StackName}-RequestsDbSecretArn'
  ProvisioningDbSecretArn:
    Value: !Ref ProvisioningDbSecret
    Export:
      Name: !Sub '${AWS::StackName}-ProvisioningDbSecretArn'
  ServiceName:
    Value: !GetAtt Service.Name
  FileSystemId:
    Value: !Ref FileSystem
  DbTls:
    Description: DB TLS mode
    Value: encrypt
    Export:
      Name: !Sub '${AWS::StackName}-DbTls'
  DbRootSecretArn:
    Description: MySQL root secret
    Value: !Ref DbRootSecret
    Export:
      Name: !Sub '${AWS::StackName}-DbRootSecretArn'
