AWSTemplateFormatVersion: '2010-09-09'
Description: 'Route 53 hosted zone for the portal subdomain (delegated from the parent domain).'

Parameters:
  ZoneName:
    Type: String
    Description: Delegated subdomain
    AllowedPattern: '^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$'

Resources:
  Zone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref ZoneName
      HostedZoneConfig:
        Comment: SIIT ICT resource portal (delegated subdomain)

Outputs:
  HostedZoneId:
    Value: !Ref Zone
    Export:
      Name: !Sub '${AWS::StackName}-HostedZoneId'
  ZoneName:
    Value: !Ref ZoneName
    Export:
      Name: !Sub '${AWS::StackName}-ZoneName'
  NameServers:
    Description: Name servers of the zone
    Value: !Join [',', !GetAtt Zone.NameServers]
