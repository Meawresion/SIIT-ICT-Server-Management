AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Smoke tests only: a placeholder Google OAuth client secret, so the backend starts without the
  real client. Sign-in can't work with it. smoke-test.sh creates and deletes this stack.

Parameters:
  Project:
    Type: String
    Default: siit

Resources:
  PlaceholderGoogleSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${Project} placeholder Google OAuth client (smoke tests)'
      SecretString: '{"GOOGLE_CLIENT_ID":"smoke-test.apps.googleusercontent.com","GOOGLE_CLIENT_SECRET":"smoke-test-placeholder"}'

Outputs:
  SecretArn:
    Value: !Ref PlaceholderGoogleSecret
