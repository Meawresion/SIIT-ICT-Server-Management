AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Backend: an internet-facing ALB and the ECS Fargate backend service in the public subnets.
  EntryMode cloudfront (the target design): only CloudFront can use the ALB (prefix list + a secret
  header). EntryMode direct (accounts without CloudFront, e.g. Learner Lab): the ALB is the public
  entry, over HTTPS with a domain, or over HTTP on its AWS name for smoke tests (no sign-in: the
  cookie needs HTTPS); it sends /api/* and /health to the backend, and the web stack adds the
  frontend for everything else. Plain settings go in the task definition; secret ones come from Secrets
  Manager (D13). With a queues stack, the backend also provisions GPU requests through SQS.

Parameters:
  Project:
    Type: String
    Default: siit
  NetworkStack:
    Type: String
  PlatformStack:
    Type: String
  DataStack:
    Type: String
    Description: data-ecs now, data-rds later (same exports)
  EntryMode:
    Type: String
    Default: cloudfront
    AllowedValues: [cloudfront, direct]
  DnsStack:
    Type: String
    Default: ''
    Description: Empty = no domain (direct mode only); the ALB's AWS name is used
  CertStack:
    Type: String
    Default: ''
    Description: Empty = HTTP listener (direct mode without a domain)
  ImageTag:
    Type: String
    Description: Tag of the siit-backend image in ECR
  ExecutionRoleArn:
    Type: String
    Description: Pulls the image and reads the secrets (Learner Lab - LabRole, D30)
  TaskRoleArn:
    Type: String
    Description: Role of the running backend (Learner Lab - LabRole, D30)
  GoogleSecretArn:
    Type: String
    Description: Secret with GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET (secrets stack, filled by set-secrets.sh)
  MailSecretArn:
    Type: String
    Default: ''
    Description: Secret with the SMTP_* and MAIL_* settings (secrets stack); empty = no status emails
  CloudFrontPrefixListId:
    Type: String
    Default: ''
    Description: Managed prefix list com.amazonaws.global.cloudfront.origin-facing in this region
  AppHost:
    Type: String
    Default: app
    Description: The portal is <AppHost>.<zone>
  OriginHost:
    Type: String
    Default: origin
    Description: The ALB is <OriginHost>.<zone>, used only by CloudFront
  DesiredCount:
    Type: Number
    Default: 1
  Cpu:
    Type: String
    Default: '256'
  Memory:
    Type: String
    Default: '512'
  StudentEmailDomain:
    Type: String
  StudentIdDigits:
    Type: Number
  DegreeEmailPrefixes:
    Type: String
    Description: JSON, e.g. {"UNDERGRADUATE":"","MASTER":"m","DOCTORAL":"d"}
  StaffEmailDomains:
    Type: String
  SessionIdleMinutes:
    Type: Number
    Default: 30
  SessionMaxHours:
    Type: Number
    Default: 12
  # Scheduler (FR-8.2, FR-8.4): end-date reminders, ended requests, dead letters.
  SchedulerIntervalSeconds:
    Type: Number
    Default: 300
    MinValue: 30
  ExpiryReminderDays:
    Type: Number
    Default: 3
    MinValue: 0
    MaxValue: 60
    Description: Days before the end date the student is reminded; 0 = no reminders
  SiteTimeZone:
    Type: String
    Default: Asia/Bangkok
    Description: The time zone request dates are in
  LogRetentionDays:
    Type: Number
    Default: 14
  QueuesStack:
    Type: String
    Default: ''
    Description: Empty = automatic provisioning off (GPU requests are activated by hand)
  SitePublicKeys:
    Type: String
    Default: ''
    Description: acc-prov-vm's public key bundle(s), comma-separated (MSG_PEER_PUBLIC_KEYS; public, not secret)
  GpuNodes:
    Type: String
    Default: ''
    Description: GPU node names as in acc-prov-vm's gpu-nodes.json, comma-separated
  OvpnProfileUrl:
    Type: String
    Default: ''
  ManualGpuUrl:
    Type: String
    Default: ''
  ManualBigDataUrl:
    Type: String
    Default: ''
  MessageJobTtlSeconds:
    Type: Number
    Default: 259200
    Description: How long a job stays valid, so it survives the site being offline

Rules:
  CloudFrontNeedsDomain:
    RuleCondition: !Equals [!Ref EntryMode, cloudfront]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref DnsStack, '']]
          - !Not [!Equals [!Ref CertStack, '']]
          - !Not [!Equals [!Ref CloudFrontPrefixListId, '']]
        AssertDescription: cloudfront mode needs DnsStack, CertStack and CloudFrontPrefixListId
  ProvisioningNeedsSettings:
    RuleCondition: !Not [!Equals [!Ref QueuesStack, '']]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref SitePublicKeys, '']]
          - !Not [!Equals [!Ref GpuNodes, '']]
          - !Not [!Equals [!Ref OvpnProfileUrl, '']]
          - !Not [!Equals [!Ref ManualGpuUrl, '']]
          - !Not [!Equals [!Ref ManualBigDataUrl, '']]
        AssertDescription: provisioning needs SitePublicKeys, GpuNodes, OvpnProfileUrl, ManualGpuUrl and ManualBigDataUrl
  CertNeedsDomain:
    RuleCondition: !Not [!Equals [!Ref CertStack, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref DnsStack, '']]
        AssertDescription: a certificate needs the DnsStack

Conditions:
  ViaCloudFront: !Equals [!Ref EntryMode, cloudfront]
  HasDomain: !Not [!Equals [!Ref DnsStack, '']]
  HasCert: !Not [!Equals [!Ref CertStack, '']]
  HasMail: !Not [!Equals [!Ref MailSecretArn, '']]
  NoCert: !Equals [!Ref CertStack, '']
  HasQueues: !Not [!Equals [!Ref QueuesStack, '']]

Resources:
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${Project} backend JWT_SECRET (signs the sign-in token)'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: JWT_SECRET
        PasswordLength: 64
        ExcludePunctuation: true
  # CloudFront adds this header to every /api request; the ALB forwards only requests that have it.
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Condition: ViaCloudFront
    Properties:
      Description: !Sub '${Project} header value proving a request came through CloudFront'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: value
        PasswordLength: 48
        ExcludePunctuation: true

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !If [ViaCloudFront, ALB (HTTPS only from CloudFront), ALB (public entry)]
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStack}-VpcId'
      SecurityGroupIngress:
        - !If
          - ViaCloudFront
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourcePrefixListId: !Ref CloudFrontPrefixListId
            Description: CloudFront origin-facing addresses
          - IpProtocol: tcp
            FromPort: !If [HasCert, 443, 80]
            ToPort: !If [HasCert, 443, 80]
            CidrIp: 0.0.0.0/0
            Description: Public entry (direct mode)
      Tags:
        - Key: Name
          Value: !Sub '${Project}-alb'
  BackendFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub '${PlatformStack}-BackendSecurityGroupId'
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: ALB to backend tasks

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PublicSubnets'}]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStack}-VpcId'
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        # The backend finishes requests in flight within 10 s of SIGTERM.
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCert
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn:
            Fn::ImportValue: !Sub '${CertStack}-CertificateArn'
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: Forbidden
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: NoCert
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: Forbidden
  # cloudfront: forward only requests with the secret header (CloudFront sends only /api/* here).
  # direct: forward the API paths; the web stack's lower-priority rule takes the rest.
  ForwardRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [HasCert, !Ref HttpsListener, !Ref HttpListener]
      Priority: 1
      Conditions:
        - !If
          - ViaCloudFront
          - Field: http-header
            HttpHeaderConfig:
              HttpHeaderName: X-Origin-Verify
              Values:
                - !Sub '{{resolve:secretsmanager:${OriginVerifySecret}:SecretString:value}}'
          - Field: path-pattern
            PathPatternConfig:
              Values: ['/api/*', '/health', '/health/*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # cloudfront: <OriginHost>.zone for CloudFront; direct: <AppHost>.zone is the ALB itself.
  AlbRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId:
        Fn::ImportValue: !Sub '${DnsStack}-HostedZoneId'
      Name: !Sub
        - '${Host}.${Zone}'
        - Host: !If [ViaCloudFront, !Ref OriginHost, !Ref AppHost]
          Zone:
            Fn::ImportValue: !Sub '${DnsStack}-ZoneName'
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${Project}/backend'
      RetentionInDays: !Ref LogRetentionDays

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Project}-backend'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: backend
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo:
                Fn::ImportValue: !Sub '${PlatformStack}-BackendRepositoryUri'
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: '3000'
            # CloudFront, then the ALB
            - Name: TRUST_PROXY
              Value: '2'
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbHost'
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbPort'
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbName'
            - Name: FRONTEND_URL
              Value: !If
                - HasDomain
                - !Sub
                  - 'https://${AppHost}.${Zone}'
                  - Zone:
                      Fn::ImportValue: !Sub '${DnsStack}-ZoneName'
                - !Sub 'http://${LoadBalancer.DNSName}'
            - Name: GOOGLE_CALLBACK_URL
              Value: !If
                - HasDomain
                - !Sub
                  - 'https://${AppHost}.${Zone}/api/auth/google/callback'
                  - Zone:
                      Fn::ImportValue: !Sub '${DnsStack}-ZoneName'
                - !Sub 'http://${LoadBalancer.DNSName}/api/auth/google/callback'
            - Name: STUDENT_EMAIL_DOMAIN
              Value: !Ref StudentEmailDomain
            - Name: STUDENT_ID_DIGITS
              Value: !Ref StudentIdDigits
            - Name: DEGREE_EMAIL_PREFIXES
              Value: !Ref DegreeEmailPrefixes
            - Name: STAFF_EMAIL_DOMAINS
              Value: !Ref StaffEmailDomains
            - Name: SESSION_IDLE_MINUTES
              Value: !Ref SessionIdleMinutes
            - Name: SESSION_MAX_HOURS
              Value: !Ref SessionMaxHours
            - Name: SCHEDULER_INTERVAL_SEC
              Value: !Ref SchedulerIntervalSeconds
            - Name: EXPIRY_REMINDER_DAYS
              Value: !Ref ExpiryReminderDays
            - Name: SITE_TIME_ZONE
              Value: !Ref SiteTimeZone
            # Automatic provisioning through acc-prov-vm (plan §2), only with a queues stack.
            - !If
              - HasQueues
              - Name: MESSAGE_TRANSPORT
                Value: sqs
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: SQS_REQUEST_QUEUE_URL
                Value:
                  Fn::ImportValue: !Sub '${QueuesStack}-RequestQueueUrl'
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: SQS_RESULT_QUEUE_URL
                Value:
                  Fn::ImportValue: !Sub '${QueuesStack}-ResultQueueUrl'
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: SQS_REQUEST_DLQ_URL
                Value:
                  Fn::ImportValue: !Sub '${QueuesStack}-RequestDeadLetterQueueUrl'
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: SQS_RESULT_DLQ_URL
                Value:
                  Fn::ImportValue: !Sub '${QueuesStack}-ResultDeadLetterQueueUrl'
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MSG_PEER_PUBLIC_KEYS
                Value: !Ref SitePublicKeys
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MSG_JOB_TTL_SEC
                Value: !Ref MessageJobTtlSeconds
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MSG_MAX_TTL_SEC
                Value: !Ref MessageJobTtlSeconds
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: GPU_NODES
                Value: !Ref GpuNodes
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: OVPN_PROFILE_URL
                Value: !Ref OvpnProfileUrl
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MANUAL_GPU_URL
                Value: !Ref ManualGpuUrl
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MANUAL_BIGDATA_URL
                Value: !Ref ManualBigDataUrl
              - !Ref AWS::NoValue
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub
                - '${Arn}:username::'
                - Arn:
                    Fn::ImportValue: !Sub '${DataStack}-DbSecretArn'
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${Arn}:password::'
                - Arn:
                    Fn::ImportValue: !Sub '${DataStack}-DbSecretArn'
            - Name: JWT_SECRET
              ValueFrom: !Sub '${AppSecret}:JWT_SECRET::'
            - Name: GOOGLE_CLIENT_ID
              ValueFrom: !Sub '${GoogleSecretArn}:GOOGLE_CLIENT_ID::'
            - Name: GOOGLE_CLIENT_SECRET
              ValueFrom: !Sub '${GoogleSecretArn}:GOOGLE_CLIENT_SECRET::'
            # Status emails (S2); SMTP_HOST empty = only logged.
            - !If
              - HasMail
              - Name: SMTP_HOST
                ValueFrom: !Sub '${MailSecretArn}:SMTP_HOST::'
              - !Ref AWS::NoValue
            - !If
              - HasMail
              - Name: SMTP_PORT
                ValueFrom: !Sub '${MailSecretArn}:SMTP_PORT::'
              - !Ref AWS::NoValue
            - !If
              - HasMail
              - Name: SMTP_SECURE
                ValueFrom: !Sub '${MailSecretArn}:SMTP_SECURE::'
              - !Ref AWS::NoValue
            - !If
              - HasMail
              - Name: SMTP_USER
                ValueFrom: !Sub '${MailSecretArn}:SMTP_USER::'
              - !Ref AWS::NoValue
            - !If
              - HasMail
              - Name: SMTP_APP_PASSWORD
                ValueFrom: !Sub '${MailSecretArn}:SMTP_APP_PASSWORD::'
              - !Ref AWS::NoValue
            - !If
              - HasMail
              - Name: MAIL_FROM
                ValueFrom: !Sub '${MailSecretArn}:MAIL_FROM::'
              - !Ref AWS::NoValue
            - !If
              - HasMail
              - Name: MAIL_REPLY_TO
                ValueFrom: !Sub '${MailSecretArn}:MAIL_REPLY_TO::'
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MSG_PRIVATE_KEY
                ValueFrom: !Sub
                  - '${Arn}:MSG_PRIVATE_KEY::'
                  - Arn:
                      Fn::ImportValue: !Sub '${QueuesStack}-BackendKeysSecretArn'
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  Service:
    Type: AWS::ECS::Service
    DependsOn: ForwardRule
    Properties:
      ServiceName: backend
      Cluster:
        Fn::ImportValue: !Sub '${PlatformStack}-ClusterName'
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PublicSubnets'}]
          SecurityGroups:
            - Fn::ImportValue: !Sub '${PlatformStack}-BackendSecurityGroupId'
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  OriginDomain:
    Condition: ViaCloudFront
    Value: !Ref AlbRecord
    Export:
      Name: !Sub '${AWS::StackName}-OriginDomain'
  OriginVerifySecretArn:
    Condition: ViaCloudFront
    Value: !Ref OriginVerifySecret
    Export:
      Name: !Sub '${AWS::StackName}-OriginVerifySecretArn'
  ListenerArn:
    Description: The web stack adds its frontend rule here (direct mode)
    Value: !If [HasCert, !Ref HttpsListener, !Ref HttpListener]
    Export:
      Name: !Sub '${AWS::StackName}-ListenerArn'
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-AlbSecurityGroupId'
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Description: For one-off tasks (infra/scripts/run-task.sh)
    Value: !Ref TaskDefinition
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  PublicUrl:
    Description: The portal in direct mode (cloudfront mode - the edge stack's AppUrl)
    Value: !If
      - HasDomain
      - !Sub
        - 'https://${AppHost}.${Zone}'
        - Zone:
            Fn::ImportValue: !Sub '${DnsStack}-ZoneName'
      - !Sub 'http://${LoadBalancer.DNSName}'
