AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Backend: an internet-facing ALB that only CloudFront can use (CloudFront prefix list + a secret
  header), and the ECS Fargate backend service in the public subnets. Plain settings go in the
  task definition environment; secret ones come from Secrets Manager (D13).

Parameters:
  Project:
    Type: String
    Default: siit
  NetworkStack:
    Type: String
  PlatformStack:
    Type: String
  DataStack:
    Type: String
    Description: data-ecs now, data-rds later (same exports)
  DnsStack:
    Type: String
  CertStack:
    Type: String
  ImageTag:
    Type: String
    Description: Tag of the siit-backend image in ECR
  ExecutionRoleArn:
    Type: String
    Description: Pulls the image and reads the secrets (Learner Lab - LabRole, D30)
  TaskRoleArn:
    Type: String
    Description: Role of the running backend (Learner Lab - LabRole, D30)
  GoogleSecretArn:
    Type: String
    Description: Secret with GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET, created once by hand (infra/README.md)
  CloudFrontPrefixListId:
    Type: String
    Description: Managed prefix list com.amazonaws.global.cloudfront.origin-facing in this region
  AppHost:
    Type: String
    Default: app
    Description: The portal is <AppHost>.<zone>
  OriginHost:
    Type: String
    Default: origin
    Description: The ALB is <OriginHost>.<zone>, used only by CloudFront
  DesiredCount:
    Type: Number
    Default: 1
  Cpu:
    Type: String
    Default: '256'
  Memory:
    Type: String
    Default: '512'
  StudentEmailDomain:
    Type: String
  StudentIdDigits:
    Type: Number
  DegreeEmailPrefixes:
    Type: String
    Description: JSON, e.g. {"UNDERGRADUATE":"","MASTER":"m","DOCTORAL":"d"}
  StaffEmailDomains:
    Type: String
  SessionIdleMinutes:
    Type: Number
    Default: 30
  SessionMaxHours:
    Type: Number
    Default: 12
  LogRetentionDays:
    Type: Number
    Default: 14

Resources:
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${Project} backend JWT_SECRET (signs the sign-in token)'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: JWT_SECRET
        PasswordLength: 64
        ExcludePunctuation: true
  # CloudFront adds this header to every /api request; the ALB forwards only requests that have it.
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${Project} header value proving a request came through CloudFront'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: value
        PasswordLength: 48
        ExcludePunctuation: true

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB (HTTPS only from CloudFront)
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStack}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing addresses
      Tags:
        - Key: Name
          Value: !Sub '${Project}-alb'
  BackendFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub '${PlatformStack}-BackendSecurityGroupId'
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: ALB to backend tasks

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PublicSubnets'}]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStack}-VpcId'
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        # The backend finishes requests in flight within 10 s of SIGTERM.
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn:
            Fn::ImportValue: !Sub '${CertStack}-CertificateArn'
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: Forbidden
  FromCloudFrontRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - !Sub '{{resolve:secretsmanager:${OriginVerifySecret}:SecretString:value}}'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  OriginRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Fn::ImportValue: !Sub '${DnsStack}-HostedZoneId'
      Name: !Sub
        - '${OriginHost}.${Zone}'
        - Zone:
            Fn::ImportValue: !Sub '${DnsStack}-ZoneName'
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${Project}/backend'
      RetentionInDays: !Ref LogRetentionDays

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Project}-backend'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: backend
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo:
                Fn::ImportValue: !Sub '${PlatformStack}-BackendRepositoryUri'
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: '3000'
            # CloudFront, then the ALB
            - Name: TRUST_PROXY
              Value: '2'
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbHost'
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbPort'
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbName'
            - Name: FRONTEND_URL
              Value: !Sub
                - 'https://${AppHost}.${Zone}'
                - Zone:
                    Fn::ImportValue: !Sub '${DnsStack}-ZoneName'
            - Name: GOOGLE_CALLBACK_URL
              Value: !Sub
                - 'https://${AppHost}.${Zone}/api/auth/google/callback'
                - Zone:
                    Fn::ImportValue: !Sub '${DnsStack}-ZoneName'
            - Name: STUDENT_EMAIL_DOMAIN
              Value: !Ref StudentEmailDomain
            - Name: STUDENT_ID_DIGITS
              Value: !Ref StudentIdDigits
            - Name: DEGREE_EMAIL_PREFIXES
              Value: !Ref DegreeEmailPrefixes
            - Name: STAFF_EMAIL_DOMAINS
              Value: !Ref StaffEmailDomains
            - Name: SESSION_IDLE_MINUTES
              Value: !Ref SessionIdleMinutes
            - Name: SESSION_MAX_HOURS
              Value: !Ref SessionMaxHours
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub
                - '${Arn}:username::'
                - Arn:
                    Fn::ImportValue: !Sub '${DataStack}-DbSecretArn'
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${Arn}:password::'
                - Arn:
                    Fn::ImportValue: !Sub '${DataStack}-DbSecretArn'
            - Name: JWT_SECRET
              ValueFrom: !Sub '${AppSecret}:JWT_SECRET::'
            - Name: GOOGLE_CLIENT_ID
              ValueFrom: !Sub '${GoogleSecretArn}:GOOGLE_CLIENT_ID::'
            - Name: GOOGLE_CLIENT_SECRET
              ValueFrom: !Sub '${GoogleSecretArn}:GOOGLE_CLIENT_SECRET::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  Service:
    Type: AWS::ECS::Service
    DependsOn: FromCloudFrontRule
    Properties:
      ServiceName: backend
      Cluster:
        Fn::ImportValue: !Sub '${PlatformStack}-ClusterName'
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PublicSubnets'}]
          SecurityGroups:
            - Fn::ImportValue: !Sub '${PlatformStack}-BackendSecurityGroupId'
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  OriginDomain:
    Value: !Ref OriginRecord
    Export:
      Name: !Sub '${AWS::StackName}-OriginDomain'
  OriginVerifySecretArn:
    Value: !Ref OriginVerifySecret
    Export:
      Name: !Sub '${AWS::StackName}-OriginVerifySecretArn'
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Description: For one-off tasks (infra/scripts/run-task.sh)
    Value: !Ref TaskDefinition
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
