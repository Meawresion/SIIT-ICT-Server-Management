AWSTemplateFormatVersion: '2010-09-09'
Description: 'Portal backend (request service) on ECS Fargate behind an ALB, with its alarms and role.'

Parameters:
  Project:
    Type: String
    Default: siit
  NetworkStack:
    Type: String
  PlatformStack:
    Type: String
  DataStack:
    Type: String
    Description: Data stack (ECS MySQL or RDS)
  EntryMode:
    Type: String
    Default: cloudfront
    AllowedValues: [cloudfront, direct]
  DnsStack:
    Type: String
    Default: ''
    Description: DNS stack; empty = no domain
  CertStack:
    Type: String
    Default: ''
    Description: Certificate stack; empty = HTTP only
  ImageTag:
    Type: String
    Description: Backend image tag
  EventsStack:
    Type: String
    Description: Events stack
  CloudFrontPrefixListId:
    Type: String
    Default: ''
    Description: CloudFront origin-facing prefix list
  AppHost:
    Type: String
    Default: app
    Description: Portal host name
  OriginHost:
    Type: String
    Default: origin
    Description: ALB host name for CloudFront
  DesiredCount:
    Type: Number
    Default: 1
  Cpu:
    Type: String
    Default: '256'
  Memory:
    Type: String
    Default: '512'
  StudentEmailDomain:
    Type: String
  StudentIdDigits:
    Type: Number
  DegreeEmailPrefixes:
    Type: String
    Description: Email prefix per degree (JSON)
  StaffEmailDomains:
    Type: String
  ApproverEmails:
    Type: String
    Default: ''
    Description: Approver email addresses (comma-separated)
  SessionIdleMinutes:
    Type: Number
    Default: 30
  SessionMaxHours:
    Type: Number
    Default: 12
  SchedulerIntervalSeconds:
    Type: Number
    Default: 300
    MinValue: 30
  ExpiryReminderDays:
    Type: Number
    Default: 3
    MinValue: 0
    MaxValue: 60
    Description: Reminder days before the end date; 0 = off
  SiteTimeZone:
    Type: String
    Default: Asia/Bangkok
    Description: Time zone of request dates
  LogsStack:
    Type: String
    Description: Logs stack
  QueuesStack:
    Type: String
    Default: ''
    Description: Queues stack; empty = provisioning off
  GpuNodes:
    Type: String
    Default: ''
    Description: GPU node names (comma-separated)
  OvpnProfileUrl:
    Type: String
    Default: ''
  ManualGpuUrl:
    Type: String
    Default: ''
  ManualBigDataUrl:
    Type: String
    Default: ''

Rules:
  CloudFrontNeedsDomain:
    RuleCondition: !Equals [!Ref EntryMode, cloudfront]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref DnsStack, '']]
          - !Not [!Equals [!Ref CertStack, '']]
          - !Not [!Equals [!Ref CloudFrontPrefixListId, '']]
        AssertDescription: cloudfront mode needs DnsStack, CertStack and CloudFrontPrefixListId
  ProvisioningNeedsSettings:
    RuleCondition: !Not [!Equals [!Ref QueuesStack, '']]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref GpuNodes, '']]
          - !Not [!Equals [!Ref OvpnProfileUrl, '']]
          - !Not [!Equals [!Ref ManualGpuUrl, '']]
          - !Not [!Equals [!Ref ManualBigDataUrl, '']]
        AssertDescription: provisioning needs GpuNodes, OvpnProfileUrl, ManualGpuUrl and ManualBigDataUrl
  CertNeedsDomain:
    RuleCondition: !Not [!Equals [!Ref CertStack, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref DnsStack, '']]
        AssertDescription: a certificate needs the DnsStack

Conditions:
  ViaCloudFront: !Equals [!Ref EntryMode, cloudfront]
  HasDomain: !Not [!Equals [!Ref DnsStack, '']]
  HasCert: !Not [!Equals [!Ref CertStack, '']]
  NoCert: !Equals [!Ref CertStack, '']
  HasQueues: !Not [!Equals [!Ref QueuesStack, '']]
  RedirectHttp: !And [!Not [!Condition ViaCloudFront], !Condition HasCert]

Resources:
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${Project} backend JWT secret'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: JWT_SECRET
        PasswordLength: 64
        ExcludePunctuation: true
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Condition: ViaCloudFront
    Properties:
      Description: !Sub '${Project} CloudFront origin header'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: value
        PasswordLength: 48
        ExcludePunctuation: true

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !If [ViaCloudFront, ALB (HTTPS only from CloudFront), ALB (public entry)]
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStack}-VpcId'
      SecurityGroupIngress:
        - !If
          - ViaCloudFront
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourcePrefixListId: !Ref CloudFrontPrefixListId
            Description: CloudFront origin-facing addresses
          - IpProtocol: tcp
            FromPort: !If [HasCert, 443, 80]
            ToPort: !If [HasCert, 443, 80]
            CidrIp: 0.0.0.0/0
            Description: Public entry (direct mode)
      Tags:
        - Key: Name
          Value: !Sub '${Project}-alb'
  AlbHttpForRedirect:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: RedirectHttp
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: HTTP, redirected to HTTPS
  BackendFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub '${PlatformStack}-BackendSecurityGroupId'
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: ALB to backend tasks

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${Project}-alb'
      Type: application
      Scheme: internet-facing
      Subnets: !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PublicSubnets'}]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: access_logs.s3.enabled
          Value: 'true'
        - Key: access_logs.s3.bucket
          Value:
            Fn::ImportValue: !Sub '${LogsStack}-BucketName'
        - Key: access_logs.s3.prefix
          Value: alb
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStack}-VpcId'
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCert
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn:
            Fn::ImportValue: !Sub '${CertStack}-CertificateArn'
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: Forbidden
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: NoCert
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: Forbidden
  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: RedirectHttp
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            Host: '#{host}'
            Path: '/#{path}'
            Query: '#{query}'
            StatusCode: HTTP_301
  ForwardRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If [HasCert, !Ref HttpsListener, !Ref HttpListener]
      Priority: 5
      Conditions:
        - !If
          - ViaCloudFront
          - Field: http-header
            HttpHeaderConfig:
              HttpHeaderName: X-Origin-Verify
              Values:
                - !Sub '{{resolve:secretsmanager:${OriginVerifySecret}:SecretString:value}}'
          - Field: path-pattern
            PathPatternConfig:
              Values: ['/api/*', '/health', '/health/*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  AlbRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId:
        Fn::ImportValue: !Sub '${DnsStack}-HostedZoneId'
      Name: !Sub
        - '${Host}.${Zone}'
        - Host: !If [ViaCloudFront, !Ref OriginHost, !Ref AppHost]
          Zone:
            Fn::ImportValue: !Sub '${DnsStack}-ZoneName'
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

  BackendErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-backend-errors'
      AlarmDescription: Backend logged an error
      Namespace:
        Fn::ImportValue: !Sub '${LogsStack}-MetricNamespace'
      MetricName: BackendErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
  AlbServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-alb-5xx'
      AlarmDescription: ALB returned 5xx
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
  BackendUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-backend-unhealthy'
      AlarmDescription: A backend task failed the ALB health check for 3 minutes
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
  TaskStoppedRule:
    Type: AWS::Events::Rule
    Properties:
      Description: !Sub '${Project} task stopped alerts'
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn:
            - !Sub
              - 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${Cluster}'
              - Cluster:
                  Fn::ImportValue: !Sub '${PlatformStack}-ClusterName'
          lastStatus: [STOPPED]
          stopCode: [EssentialContainerExited, TaskFailedToStart]
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub '${LogsStack}-AlertTopicArn'
          InputTransformer:
            InputPathsMap:
              group: $.detail.group
              code: $.detail.stopCode
              reason: $.detail.stoppedReason
              task: $.detail.taskArn
            InputTemplate: '"ECS task stopped: <group> (<code>): <reason>. Task <task>. Its last log lines are in CloudWatch Logs."'

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-backend-exec'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-task
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Project}-backend'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${Project}/backend:*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppSecret
                  - Fn::ImportValue: !Sub '${DataStack}-RequestsDbSecretArn'
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-backend-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: events
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource:
                  Fn::ImportValue: !Sub '${EventsStack}-EventBusArn'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Project}-backend'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo:
                Fn::ImportValue: !Sub '${PlatformStack}-BackendRepositoryUri'
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: '3000'
            - Name: TRUST_PROXY
              Value: '2'
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbHost'
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbPort'
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbName'
            - Name: DB_TLS
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbTls'
            - Name: FRONTEND_URL
              Value: !If
                - HasDomain
                - !Sub
                  - 'https://${AppHost}.${Zone}'
                  - Zone:
                      Fn::ImportValue: !Sub '${DnsStack}-ZoneName'
                - !Sub 'http://${LoadBalancer.DNSName}'
            - Name: STUDENT_EMAIL_DOMAIN
              Value: !Ref StudentEmailDomain
            - Name: STUDENT_ID_DIGITS
              Value: !Ref StudentIdDigits
            - Name: DEGREE_EMAIL_PREFIXES
              Value: !Ref DegreeEmailPrefixes
            - Name: STAFF_EMAIL_DOMAINS
              Value: !Ref StaffEmailDomains
            - Name: APPROVER_EMAILS
              Value: !Ref ApproverEmails
            - Name: SESSION_IDLE_MINUTES
              Value: !Ref SessionIdleMinutes
            - Name: SESSION_MAX_HOURS
              Value: !Ref SessionMaxHours
            - Name: SCHEDULER_INTERVAL_SEC
              Value: !Ref SchedulerIntervalSeconds
            - Name: EXPIRY_REMINDER_DAYS
              Value: !Ref ExpiryReminderDays
            - Name: SITE_TIME_ZONE
              Value: !Ref SiteTimeZone
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: SERVICE_ROLE
              Value: requests
            - Name: EVENT_BUS_NAME
              Value:
                Fn::ImportValue: !Sub '${EventsStack}-EventBusName'
            - !If
              - HasQueues
              - Name: MESSAGE_TRANSPORT
                Value: sqs
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: GPU_NODES
                Value: !Ref GpuNodes
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: OVPN_PROFILE_URL
                Value: !Ref OvpnProfileUrl
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MANUAL_GPU_URL
                Value: !Ref ManualGpuUrl
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MANUAL_BIGDATA_URL
                Value: !Ref ManualBigDataUrl
              - !Ref AWS::NoValue
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub
                - '${Arn}:username::'
                - Arn:
                    Fn::ImportValue: !Sub '${DataStack}-RequestsDbSecretArn'
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${Arn}:password::'
                - Arn:
                    Fn::ImportValue: !Sub '${DataStack}-RequestsDbSecretArn'
            - Name: JWT_SECRET
              ValueFrom: !Sub '${AppSecret}:JWT_SECRET::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${LogsStack}-BackendLogGroup'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  Service:
    Type: AWS::ECS::Service
    DependsOn: ForwardRule
    Properties:
      ServiceName: backend
      Cluster:
        Fn::ImportValue: !Sub '${PlatformStack}-ClusterName'
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PublicSubnets'}]
          SecurityGroups:
            - Fn::ImportValue: !Sub '${PlatformStack}-BackendSecurityGroupId'
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  OriginDomain:
    Condition: ViaCloudFront
    Value: !Ref AlbRecord
    Export:
      Name: !Sub '${AWS::StackName}-OriginDomain'
  OriginVerifySecretArn:
    Condition: ViaCloudFront
    Value: !Ref OriginVerifySecret
    Export:
      Name: !Sub '${AWS::StackName}-OriginVerifySecretArn'
  AppSecretArn:
    Description: JWT secret
    Value: !Ref AppSecret
    Export:
      Name: !Sub '${AWS::StackName}-AppSecretArn'
  ListenerArn:
    Description: HTTPS listener
    Value: !If [HasCert, !Ref HttpsListener, !Ref HttpListener]
    Export:
      Name: !Sub '${AWS::StackName}-ListenerArn'
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-AlbSecurityGroupId'
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Description: Backend task definition
    Value: !Ref TaskDefinition
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  LoadBalancerFullName:
    Description: ALB full name
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub '${AWS::StackName}-LoadBalancerFullName'
  PublicUrl:
    Description: Portal URL
    Export:
      Name: !Sub '${AWS::StackName}-PublicUrl'
    Value: !If
      - HasDomain
      - !Sub
        - 'https://${AppHost}.${Zone}'
        - Zone:
            Fn::ImportValue: !Sub '${DnsStack}-ZoneName'
      - !Sub 'http://${LoadBalancer.DNSName}'
