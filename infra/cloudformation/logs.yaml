AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Logs and alerts that outlive the app stacks: one CloudWatch Logs group per service (searched with
  Logs Insights), the audit trail group kept for the audit period (NFR-7.1), saved queries, the
  error metric filters, the alert topic, and an S3 bucket for the ALB access logs (the ALB can only
  write to S3). Kept between test runs like dns: deleting it deletes the logs. teardown-all.sh
  empties the bucket first.

Parameters:
  Project:
    Type: String
    Default: siit
  AppLogDays:
    Type: Number
    Default: 90
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731]
    Description: Days the service log groups keep a line
  AuditLogDays:
    Type: Number
    Default: 400
    AllowedValues: [365, 400, 545, 731, 1096, 1827]
    Description: Days the audit trail group keeps an event (at least one academic year, NFR-7.1)
  AlbLogDays:
    Type: Number
    Default: 400
    MinValue: 1
    Description: Days an ALB access log file is kept in S3
  AlertEmail:
    Type: String
    Default: ''
    Description: Empty = no email; else alarms are mailed here (AWS sends a confirmation link first)

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Mappings:
  # The account that writes ALB access logs in regions older than August 2022.
  ElbLogAccount:
    us-east-1: {Account: '127311923021'}
    us-east-2: {Account: '033677994240'}
    us-west-1: {Account: '027434742980'}
    us-west-2: {Account: '797873946194'}
    ap-southeast-1: {Account: '114774131450'}
    ap-northeast-1: {Account: '582318560864'}
    eu-west-1: {Account: '156460612806'}
    eu-central-1: {Account: '054676820928'}

Resources:
  # Each container writes one JSON line per event to stdout; ECS sends it to its group.
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${Project}/backend'
      RetentionInDays: !Ref AppLogDays
  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${Project}/frontend'
      RetentionInDays: !Ref AppLogDays
  # The identity service (D34: sign-in, profiles).
  IdentityLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${Project}/identity'
      RetentionInDays: !Ref AppLogDays
  # The provisioning service (D34: site jobs and results, scheduler, audit shipping).
  ProvisioningLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${Project}/provisioning'
      RetentionInDays: !Ref AppLogDays
  # The notification service (Lambda).
  NotificationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${Project}/notification'
      RetentionInDays: !Ref AppLogDays
  MysqlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${Project}/mysql'
      RetentionInDays: !Ref AppLogDays
  # The backend copies every request_event row here (one JSON line per event), so the trail
  # outlives the database.
  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${Project}/audit'
      RetentionInDays: !Ref AuditLogDays

  # Metric filters cost nothing; the alarms on these metrics live in the app and web stacks, so
  # they are billed only while the app runs.
  BackendErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BackendLogGroup
      FilterPattern: '{ $.level = "error" }'
      MetricTransformations:
        - MetricNamespace: !Sub '${Project}/logs'
          MetricName: BackendErrors
          MetricValue: '1'
          DefaultValue: 0
  # Same metric as the request service's errors, so one alarm covers both API services.
  IdentityErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref IdentityLogGroup
      FilterPattern: '{ $.level = "error" }'
      MetricTransformations:
        - MetricNamespace: !Sub '${Project}/logs'
          MetricName: BackendErrors
          MetricValue: '1'
          DefaultValue: 0
  ProvisioningErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ProvisioningLogGroup
      FilterPattern: '{ $.level = "error" }'
      MetricTransformations:
        - MetricNamespace: !Sub '${Project}/logs'
          MetricName: ProvisioningErrors
          MetricValue: '1'
          DefaultValue: 0
  NotificationErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref NotificationLogGroup
      FilterPattern: '{ $.level = "error" }'
      MetricTransformations:
        - MetricNamespace: !Sub '${Project}/logs'
          MetricName: NotificationErrors
          MetricValue: '1'
          DefaultValue: 0
  BackendServerErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BackendLogGroup
      FilterPattern: '{ $.event = "http.request" && $.status >= 500 }'
      MetricTransformations:
        - MetricNamespace: !Sub '${Project}/logs'
          MetricName: Backend5xx
          MetricValue: '1'
          DefaultValue: 0

  # Saved Logs Insights queries (CloudWatch > Logs Insights > Saved queries). Replace the
  # placeholder in quotes before running.
  FindReferenceQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${Project}/find-reference'
      LogGroupNames: [!Ref BackendLogGroup, !Ref IdentityLogGroup, !Ref ProvisioningLogGroup, !Ref NotificationLogGroup, !Ref FrontendLogGroup, !Ref MysqlLogGroup, !Ref AuditLogGroup]
      QueryString: |-
        fields @timestamp, @log, @message
        | filter @message like "REFERENCE-FROM-THE-ERROR-PAGE"
        | sort @timestamp asc
        | limit 200
  RecentErrorsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${Project}/backend-errors'
      LogGroupNames: [!Ref BackendLogGroup, !Ref IdentityLogGroup, !Ref ProvisioningLogGroup, !Ref NotificationLogGroup]
      QueryString: |-
        fields @timestamp, event, request_id, error.message, @message
        | filter level = "error" or status >= 500
        | sort @timestamp desc
        | limit 100
  RequestAuditQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${Project}/audit-of-request'
      LogGroupNames: [!Ref AuditLogGroup]
      QueryString: |-
        fields at, action, from_status, to_status, actor_uid, comment, details
        | filter rid = 0
        | sort eid asc
  ProvisioningFailuresQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${Project}/provisioning-failures'
      LogGroupNames: [!Ref AuditLogGroup]
      QueryString: |-
        fields at, rid, action, comment, details
        | filter action like /FAILED/
        | sort at desc
        | limit 100
  SlowRequestsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${Project}/slow-requests'
      LogGroupNames: [!Ref BackendLogGroup]
      QueryString: |-
        fields @timestamp, method, path, status, ms, request_id
        | filter event = "http.request" and ms > 1000
        | sort ms desc
        | limit 100

  # Alarms and the "task stopped" rule publish here. An idle topic costs nothing; email is free up
  # to 1,000 a month.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${Project}-alerts'
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AlarmsAndEvents
            Effect: Allow
            Principal:
              Service: [cloudwatch.amazonaws.com, events.amazonaws.com]
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref AWS::AccountId}
  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      # ALB access logs need SSE-S3 (not KMS).
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: !Ref AlbLogDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: !Sub '${Project}-logs'

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Bucket.Arn, !Sub '${Bucket.Arn}/*']
            Condition:
              Bool: {'aws:SecureTransport': 'false'}
          - Sid: AlbAccessLogsOlderRegions
            Effect: Allow
            Principal:
              AWS: !Sub
                - 'arn:${AWS::Partition}:iam::${Account}:root'
                - Account: !FindInMap [ElbLogAccount, !Ref 'AWS::Region', Account]
            Action: s3:PutObject
            Resource: !Sub '${Bucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*'
          - Sid: AlbAccessLogs
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${Bucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*'

Outputs:
  BucketName:
    Value: !Ref Bucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'
  BackendLogGroup:
    Value: !Ref BackendLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-BackendLogGroup'
  FrontendLogGroup:
    Value: !Ref FrontendLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-FrontendLogGroup'
  IdentityLogGroup:
    Value: !Ref IdentityLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-IdentityLogGroup'
  ProvisioningLogGroup:
    Value: !Ref ProvisioningLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-ProvisioningLogGroup'
  NotificationLogGroup:
    Value: !Ref NotificationLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-NotificationLogGroup'
  MysqlLogGroup:
    Value: !Ref MysqlLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-MysqlLogGroup'
  AuditLogGroup:
    Value: !Ref AuditLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-AuditLogGroup'
  AuditLogGroupArn:
    Value: !GetAtt AuditLogGroup.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AuditLogGroupArn'
  MetricNamespace:
    Value: !Sub '${Project}/logs'
    Export:
      Name: !Sub '${AWS::StackName}-MetricNamespace'
  AlertTopicArn:
    Value: !Ref AlertTopic
    Export:
      Name: !Sub '${AWS::StackName}-AlertTopicArn'
