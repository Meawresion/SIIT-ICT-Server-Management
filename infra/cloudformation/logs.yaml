AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Log archive in S3: every container log line (CloudWatch Logs subscription -> Kinesis Data
  Firehose) and the ALB access logs, kept for the audit period (NFR-7.1). Kept between test runs
  like dns: deleting it deletes the logs. teardown-all.sh empties the bucket first.

Parameters:
  Project:
    Type: String
    Default: siit
  # Learner Lab: LabRole for both (it trusts firehose.amazonaws.com and logs.amazonaws.com). With a
  # full account: a role for Firehose to write the bucket, and one for CloudWatch Logs to put
  # records into the delivery stream.
  FirehoseRoleArn:
    Type: String
  SubscriptionRoleArn:
    Type: String
  RetentionDays:
    Type: Number
    Default: 400
    MinValue: 1
    Description: Days a log object is kept (at least one academic year, NFR-7.1)
  BufferSeconds:
    Type: Number
    Default: 60
    MinValue: 60
    MaxValue: 900
    Description: Firehose writes a file at least this often (or every 5 MB)

Mappings:
  # The account that writes ALB access logs in regions older than August 2022.
  ElbLogAccount:
    us-east-1: {Account: '127311923021'}
    us-east-2: {Account: '033677994240'}
    us-west-1: {Account: '027434742980'}
    us-west-2: {Account: '797873946194'}
    ap-southeast-1: {Account: '114774131450'}
    ap-northeast-1: {Account: '582318560864'}
    eu-west-1: {Account: '156460612806'}
    eu-central-1: {Account: '054676820928'}

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      # ALB access logs need SSE-S3 (not KMS).
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: !Ref RetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: !Sub '${Project}-logs'

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Bucket.Arn, !Sub '${Bucket.Arn}/*']
            Condition:
              Bool: {'aws:SecureTransport': 'false'}
          - Sid: AlbAccessLogsOlderRegions
            Effect: Allow
            Principal:
              AWS: !Sub
                - 'arn:${AWS::Partition}:iam::${Account}:root'
                - Account: !FindInMap [ElbLogAccount, !Ref 'AWS::Region', Account]
            Action: s3:PutObject
            Resource: !Sub '${Bucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*'
          - Sid: AlbAccessLogs
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${Bucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*'

  # Each CloudWatch Logs batch arrives gzipped; Firehose unpacks it and writes one JSON object per
  # batch per line: { logGroup, logStream, logEvents: [{ id, timestamp, message }] }. The message is
  # the container's own JSON log line. Files are gzipped and grouped by UTC date.
  DeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub '${Project}-logs'
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !GetAtt Bucket.Arn
        RoleARN: !Ref FirehoseRoleArn
        Prefix: 'app/!{timestamp:yyyy}/!{timestamp:MM}/!{timestamp:dd}/'
        ErrorOutputPrefix: 'firehose-errors/!{firehose:error-output-type}/!{timestamp:yyyy}/!{timestamp:MM}/!{timestamp:dd}/'
        BufferingHints:
          IntervalInSeconds: !Ref BufferSeconds
          SizeInMBs: 5
        CompressionFormat: GZIP
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Decompression
              Parameters:
                - ParameterName: CompressionFormat
                  ParameterValue: GZIP
            - Type: AppendDelimiterToRecord
              Parameters:
                - ParameterName: Delimiter
                  ParameterValue: '\n'
        CloudWatchLoggingOptions:
          Enabled: false

Outputs:
  BucketName:
    Value: !Ref Bucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'
  DeliveryStreamArn:
    Value: !GetAtt DeliveryStream.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DeliveryStreamArn'
  SubscriptionRoleArn:
    Value: !Ref SubscriptionRoleArn
    Export:
      Name: !Sub '${AWS::StackName}-SubscriptionRoleArn'
