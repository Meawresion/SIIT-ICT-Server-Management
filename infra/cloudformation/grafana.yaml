AWSTemplateFormatVersion: '2010-09-09'
Description: 'Grafana operations dashboards at /grafana/ on ECS Fargate.'

Parameters:
  Project:
    Type: String
    Default: siit
  NetworkStack:
    Type: String
  PlatformStack:
    Type: String
  AppStack:
    Type: String
  LogsStack:
    Type: String
  ImageTag:
    Type: String
  GoogleSecretArn:
    Type: String
    Description: Google OAuth client secret
  OriginVerifySecretArn:
    Type: String
    Default: ''
    Description: CloudFront origin header secret; empty in direct mode
  SignInRule:
    Type: String
    Default: ''
    Description: Google sign-in role rule; empty = admin only
  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues: [0, 1]
    Description: 0 or 1
  Cpu:
    Type: String
    Default: '256'
  Memory:
    Type: String
    Default: '1024'

Conditions:
  ViaCloudFront: !Not [!Equals [!Ref OriginVerifySecretArn, '']]
  GoogleSignIn: !Not [!Equals [!Ref SignInRule, '']]

Resources:
  AdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${Project} Grafana admin'
      GenerateSecretString:
        SecretStringTemplate: '{"username":"admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Grafana task (3000 only from the ALB)
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStack}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub '${AppStack}-AlbSecurityGroupId'
          Description: ALB
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: CloudWatch, ECR, Secrets Manager, Google sign-in (HTTPS)
      Tags:
        - Key: Name
          Value: !Sub '${Project}-grafana'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStack}-VpcId'
      HealthCheckPath: /grafana/api/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '15'

  GrafanaRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub '${AppStack}-ListenerArn'
      Priority: 3
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ['/grafana', '/grafana/*']
        - !If
          - ViaCloudFront
          - Field: http-header
            HttpHeaderConfig:
              HttpHeaderName: X-Origin-Verify
              Values:
                - !Sub '{{resolve:secretsmanager:${OriginVerifySecretArn}:SecretString:value}}'
          - !Ref AWS::NoValue
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-grafana-exec'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-task
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Project}-grafana'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${Project}/grafana:*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref AdminSecret, !Ref GoogleSecretArn]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-grafana-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-cloudwatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmsForMetric
                  - cloudwatch:DescribeAlarmHistory
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                  - logs:DescribeLogGroups
                  - logs:GetQueryResults
                  - logs:StopQuery
                  - ec2:DescribeRegions
                  - tag:GetResources
                Resource: '*'
              - Effect: Allow
                Action: [logs:StartQuery, logs:GetLogGroupFields, logs:GetLogEvents, logs:FilterLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${Project}/*'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Project}-grafana'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: grafana
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo:
                Fn::ImportValue: !Sub '${PlatformStack}-GrafanaRepositoryUri'
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: SIIT_PROJECT
              Value: !Ref Project
            - Name: SIIT_ALB
              Value:
                Fn::ImportValue: !Sub '${AppStack}-LoadBalancerFullName'
            - Name: GF_SERVER_ROOT_URL
              Value: !Sub
                - '${Url}/grafana/'
                - Url:
                    Fn::ImportValue: !Sub '${AppStack}-PublicUrl'
            - Name: GF_SERVER_SERVE_FROM_SUB_PATH
              Value: 'true'
            - Name: GF_SECURITY_CSRF_TRUSTED_ORIGINS
              Value: !Select
                - 2
                - !Split
                  - '/'
                  - Fn::ImportValue: !Sub '${AppStack}-PublicUrl'
            - Name: GF_SECURITY_ADMIN_USER
              Value: admin
            - Name: GF_SECURITY_COOKIE_SECURE
              Value: 'true'
            - Name: GF_SECURITY_COOKIE_SAMESITE
              Value: lax
            - Name: GF_SECURITY_DISABLE_GRAVATAR
              Value: 'true'
            - Name: GF_USERS_ALLOW_SIGN_UP
              Value: 'false'
            - Name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
              Value: Viewer
            - Name: GF_AUTH_ANONYMOUS_ENABLED
              Value: 'false'
            - Name: GF_AUTH_GOOGLE_ENABLED
              Value: !If [GoogleSignIn, 'true', 'false']
            - Name: GF_AUTH_GOOGLE_ALLOW_SIGN_UP
              Value: 'true'
            - Name: GF_AUTH_GOOGLE_ROLE_ATTRIBUTE_PATH
              Value: !Ref SignInRule
            - Name: GF_AUTH_GOOGLE_ROLE_ATTRIBUTE_STRICT
              Value: 'true'
            - Name: GF_AUTH_GOOGLE_SCOPES
              Value: openid email profile
            - Name: GF_ANALYTICS_REPORTING_ENABLED
              Value: 'false'
            - Name: GF_ANALYTICS_CHECK_FOR_UPDATES
              Value: 'false'
            - Name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              Value: 'false'
            - Name: GF_NEWS_NEWS_FEED_ENABLED
              Value: 'false'
            - Name: GF_LOG_MODE
              Value: console
            - Name: GF_LOG_CONSOLE_FORMAT
              Value: json
          Secrets:
            - Name: GF_SECURITY_ADMIN_PASSWORD
              ValueFrom: !Sub '${AdminSecret}:password::'
            - Name: GF_AUTH_GOOGLE_CLIENT_ID
              ValueFrom: !Sub '${GoogleSecretArn}:GOOGLE_CLIENT_ID::'
            - Name: GF_AUTH_GOOGLE_CLIENT_SECRET
              ValueFrom: !Sub '${GoogleSecretArn}:GOOGLE_CLIENT_SECRET::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${LogsStack}-GrafanaLogGroup'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: grafana

  Service:
    Type: AWS::ECS::Service
    DependsOn: GrafanaRule
    Properties:
      ServiceName: grafana
      Cluster:
        Fn::ImportValue: !Sub '${PlatformStack}-ClusterName'
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PublicSubnets'}]
          SecurityGroups: [!Ref SecurityGroup]
      LoadBalancers:
        - ContainerName: grafana
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  AdminSecretArn:
    Description: Grafana admin secret
    Value: !Ref AdminSecret
  GrafanaPath:
    Value: /grafana/
