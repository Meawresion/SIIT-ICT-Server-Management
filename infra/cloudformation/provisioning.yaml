AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  The provisioning service (D34): the backend image started as `node src/worker.js`, without HTTP
  or a load balancer. It sends the outbox's jobs to the site, applies the results, runs the
  scheduler (reminders, expiry, dead letters, jobs without an answer) and copies the audit trail
  to its log group. Only this service holds the backend's message key and reads the site queues;
  the API service just queues jobs. Deleted with the app between test runs.

Parameters:
  Project:
    Type: String
    Default: siit
  NetworkStack:
    Type: String
  PlatformStack:
    Type: String
  DataStack:
    Type: String
  AppStack:
    Type: String
  LogsStack:
    Type: String
  EventsStack:
    Type: String
  QueuesStack:
    Type: String
    Default: ''
    Description: Empty = automatic provisioning off (only the scheduler and audit shipping run)
  ImageTag:
    Type: String
  ExecutionRoleArn:
    Type: String
  TaskRoleArn:
    Type: String
  DesiredCount:
    Type: Number
    Default: 1
    Description: Several tasks are safe (SKIP LOCKED, the scheduler lease); one is enough
  Cpu:
    Type: String
    Default: '256'
  Memory:
    Type: String
    Default: '512'
  StudentEmailDomain:
    Type: String
  StudentIdDigits:
    Type: Number
  DegreeEmailPrefixes:
    Type: String
  StaffEmailDomains:
    Type: String
  ApproverEmails:
    Type: String
    Default: ''
    Description: The approvers, exact addresses (comma-separated); when set, the only approvers. Empty - the role column (set-user-role.js)
  SchedulerIntervalSeconds:
    Type: Number
    Default: 300
    MinValue: 30
  ExpiryReminderDays:
    Type: Number
    Default: 3
    MinValue: 0
    MaxValue: 60
  SiteTimeZone:
    Type: String
    Default: Asia/Bangkok
  SitePublicKeys:
    Type: String
    Default: ''
  GpuNodes:
    Type: String
    Default: ''
  OvpnProfileUrl:
    Type: String
    Default: ''
  ManualGpuUrl:
    Type: String
    Default: ''
  ManualBigDataUrl:
    Type: String
    Default: ''
  MessageJobTtlSeconds:
    Type: Number
    Default: 259200
  SiteHeartbeatMinutes:
    Type: Number
    Default: 15
    MinValue: 0
    MaxValue: 1440
    Description: Alarm when no site heartbeat arrived for this many minutes (acc-prov-vm sends one every 5); 0 = no alarm
  QueueWaitMinutes:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1440
    Description: Alarm when jobs wait this many minutes and the site takes none of them

Rules:
  ProvisioningNeedsSettings:
    RuleCondition: !Not [!Equals [!Ref QueuesStack, '']]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref SitePublicKeys, '']]
          - !Not [!Equals [!Ref GpuNodes, '']]
          - !Not [!Equals [!Ref OvpnProfileUrl, '']]
          - !Not [!Equals [!Ref ManualGpuUrl, '']]
          - !Not [!Equals [!Ref ManualBigDataUrl, '']]
        AssertDescription: provisioning needs SitePublicKeys, GpuNodes, OvpnProfileUrl, ManualGpuUrl and ManualBigDataUrl

Conditions:
  HasQueues: !Not [!Equals [!Ref QueuesStack, '']]
  WatchHeartbeat: !And
    - !Condition HasQueues
    - !Not [!Equals [!Ref SiteHeartbeatMinutes, 0]]

Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Project}-provisioning'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: provisioning
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo:
                Fn::ImportValue: !Sub '${PlatformStack}-BackendRepositoryUri'
          Essential: true
          Command: [node, src/worker.js]
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: SERVICE_ROLE
              Value: worker
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbHost'
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbPort'
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbName'
            # TLS to the database (D31): verify on RDS, encrypt on the ECS MySQL.
            - Name: DB_TLS
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbTls'
            # The portal link in the status emails.
            - Name: FRONTEND_URL
              Value:
                Fn::ImportValue: !Sub '${AppStack}-PublicUrl'
            # The sign-in domains: status emails go only there.
            - Name: STUDENT_EMAIL_DOMAIN
              Value: !Ref StudentEmailDomain
            - Name: STUDENT_ID_DIGITS
              Value: !Ref StudentIdDigits
            - Name: DEGREE_EMAIL_PREFIXES
              Value: !Ref DegreeEmailPrefixes
            - Name: STAFF_EMAIL_DOMAINS
              Value: !Ref StaffEmailDomains
            - Name: APPROVER_EMAILS
              Value: !Ref ApproverEmails
            - Name: SCHEDULER_INTERVAL_SEC
              Value: !Ref SchedulerIntervalSeconds
            - Name: EXPIRY_REMINDER_DAYS
              Value: !Ref ExpiryReminderDays
            - Name: SITE_TIME_ZONE
              Value: !Ref SiteTimeZone
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AUDIT_LOG_GROUP
              Value:
                Fn::ImportValue: !Sub '${LogsStack}-AuditLogGroup'
            - Name: EVENT_BUS_NAME
              Value:
                Fn::ImportValue: !Sub '${EventsStack}-EventBusName'
            - !If
              - HasQueues
              - Name: MESSAGE_TRANSPORT
                Value: sqs
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: SQS_REQUEST_QUEUE_URL
                Value:
                  Fn::ImportValue: !Sub '${QueuesStack}-RequestQueueUrl'
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: SQS_RESULT_QUEUE_URL
                Value:
                  Fn::ImportValue: !Sub '${QueuesStack}-ResultQueueUrl'
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: SQS_REQUEST_DLQ_URL
                Value:
                  Fn::ImportValue: !Sub '${QueuesStack}-RequestDeadLetterQueueUrl'
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: SQS_RESULT_DLQ_URL
                Value:
                  Fn::ImportValue: !Sub '${QueuesStack}-ResultDeadLetterQueueUrl'
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MSG_PEER_PUBLIC_KEYS
                Value: !Ref SitePublicKeys
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MSG_JOB_TTL_SEC
                Value: !Ref MessageJobTtlSeconds
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MSG_MAX_TTL_SEC
                Value: !Ref MessageJobTtlSeconds
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: GPU_NODES
                Value: !Ref GpuNodes
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: OVPN_PROFILE_URL
                Value: !Ref OvpnProfileUrl
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MANUAL_GPU_URL
                Value: !Ref ManualGpuUrl
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MANUAL_BIGDATA_URL
                Value: !Ref ManualBigDataUrl
              - !Ref AWS::NoValue
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub
                - '${Arn}:username::'
                - Arn:
                    Fn::ImportValue: !Sub '${DataStack}-ProvisioningDbSecretArn'
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${Arn}:password::'
                - Arn:
                    Fn::ImportValue: !Sub '${DataStack}-ProvisioningDbSecretArn'
            - !If
              - HasQueues
              - Name: MSG_PRIVATE_KEY
                ValueFrom: !Sub
                  - '${Arn}:MSG_PRIVATE_KEY::'
                  - Arn:
                      Fn::ImportValue: !Sub '${QueuesStack}-BackendKeysSecretArn'
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${LogsStack}-ProvisioningLogGroup'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: provisioning

  # No load balancer: it only talks to the database, SQS, EventBridge and CloudWatch Logs.
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: provisioning
      Cluster:
        Fn::ImportValue: !Sub '${PlatformStack}-ClusterName'
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PublicSubnets'}]
          SecurityGroups:
            - Fn::ImportValue: !Sub '${PlatformStack}-BackendSecurityGroupId'

  ProvisioningErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-provisioning-errors'
      AlarmDescription: The provisioning service logged an error (find it with find-in-logs.sh --group provisioning)
      Namespace:
        Fn::ImportValue: !Sub '${LogsStack}-MetricNamespace'
      MetricName: ProvisioningErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
  # A job or result the other side could not process (the scheduler also fails the request).
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasQueues
    Properties:
      AlarmName: !Sub '${Project}-dead-letters'
      AlarmDescription: A provisioning job or result reached a dead-letter queue
      Metrics:
        - Id: total
          Expression: requests + results
          ReturnData: true
        - Id: requests
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 300
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions:
                - Name: QueueName
                  Value: !Sub '${Project}-provision-requests-dlq'
        - Id: results
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 300
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions:
                - Name: QueueName
                  Value: !Sub '${Project}-provision-results-dlq'
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]

  # The SIIT site's health (acc-prov-vm's heartbeat, every 5 minutes through the result queue; this
  # service logs each one as site.heartbeat). No inbound connection to the site is needed.
  SiteHeartbeatFilter:
    Type: AWS::Logs::MetricFilter
    Condition: HasQueues
    Properties:
      LogGroupName:
        Fn::ImportValue: !Sub '${LogsStack}-ProvisioningLogGroup'
      FilterPattern: '{ $.event = "site.heartbeat" }'
      MetricTransformations:
        - MetricNamespace:
            Fn::ImportValue: !Sub '${LogsStack}-MetricNamespace'
          MetricName: SiteHeartbeats
          MetricValue: '1'
  SiteProblemsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: HasQueues
    Properties:
      LogGroupName:
        Fn::ImportValue: !Sub '${LogsStack}-ProvisioningLogGroup'
      FilterPattern: '{ $.event = "site.heartbeat" && $.problems > 0 }'
      MetricTransformations:
        - MetricNamespace:
            Fn::ImportValue: !Sub '${LogsStack}-MetricNamespace'
          MetricName: SiteProblems
          MetricValue: '1'
  # One-minute periods, each without a heartbeat counts as breaching: the alarm needs every minute
  # of the window empty, so it fires only after SiteHeartbeatMinutes without one.
  SiteHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WatchHeartbeat
    Properties:
      AlarmName: !Sub '${Project}-site-heartbeat-missing'
      AlarmDescription: !Sub >-
        No heartbeat from the SIIT site (acc-prov-vm) for ${SiteHeartbeatMinutes} minutes: the
        worker, its host or network is down, or its AWS keys expired (journalctl -u acc-prov-vm)
      Namespace:
        Fn::ImportValue: !Sub '${LogsStack}-MetricNamespace'
      MetricName: SiteHeartbeats
      Statistic: Sum
      Period: 60
      EvaluationPeriods: !Ref SiteHeartbeatMinutes
      DatapointsToAlarm: !Ref SiteHeartbeatMinutes
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
      OKActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
  SiteProblemsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WatchHeartbeat
    Properties:
      AlarmName: !Sub '${Project}-site-check-failed'
      AlarmDescription: >-
        The SIIT site can't reach pfSense or a GPU/Hadoop node (two heartbeats in a row); the
        failed names are in the site.heartbeat lines (find-in-logs.sh site.heartbeat --group provisioning)
      Namespace:
        Fn::ImportValue: !Sub '${LogsStack}-MetricNamespace'
      MetricName: SiteProblems
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
  # Jobs wait and the site takes none: the worker is stuck, or another consumer is missing. The
  # worker runs one job at a time and a GPU setup can take 10-15 minutes, so a job in flight
  # doesn't count (it isn't visible); two approvals during one long setup can still trip it.
  QueueWaitAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasQueues
    Properties:
      AlarmName: !Sub '${Project}-site-not-taking-jobs'
      AlarmDescription: !Sub 'Provisioning jobs waited ${QueueWaitMinutes} minutes and the SIIT site took none of them'
      Metrics:
        - Id: stuck
          Expression: IF(waiting > 0 AND taken == 0, 1, 0)
          Label: Jobs waiting, none taken
          ReturnData: true
        - Id: waiting
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions:
                - Name: QueueName
                  Value: !Sub '${Project}-provision-requests'
        - Id: taken
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 60
            Metric:
              Namespace: AWS/SQS
              MetricName: NumberOfMessagesReceived
              Dimensions:
                - Name: QueueName
                  Value: !Sub '${Project}-provision-requests'
      EvaluationPeriods: !Ref QueueWaitMinutes
      DatapointsToAlarm: !Ref QueueWaitMinutes
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Description: For one-off tasks (run-task.sh --provisioning)
    Value: !Ref TaskDefinition
