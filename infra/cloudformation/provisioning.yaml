AWSTemplateFormatVersion: '2010-09-09'
Description: 'Provisioning service: site jobs over SQS, scheduler, audit shipping, site alarms.'

Parameters:
  Project:
    Type: String
    Default: siit
  NetworkStack:
    Type: String
  PlatformStack:
    Type: String
  DataStack:
    Type: String
  AppStack:
    Type: String
  LogsStack:
    Type: String
  EventsStack:
    Type: String
  QueuesStack:
    Type: String
    Default: ''
    Description: Queues stack; empty = provisioning off
  ImageTag:
    Type: String
  DesiredCount:
    Type: Number
    Default: 1
    Description: Task count
  Cpu:
    Type: String
    Default: '256'
  Memory:
    Type: String
    Default: '512'
  StudentEmailDomain:
    Type: String
  StudentIdDigits:
    Type: Number
  DegreeEmailPrefixes:
    Type: String
  StaffEmailDomains:
    Type: String
  ApproverEmails:
    Type: String
    Default: ''
    Description: Approver email addresses (comma-separated)
  SchedulerIntervalSeconds:
    Type: Number
    Default: 300
    MinValue: 30
  ExpiryReminderDays:
    Type: Number
    Default: 3
    MinValue: 0
    MaxValue: 60
  SiteTimeZone:
    Type: String
    Default: Asia/Bangkok
  SitePublicKeys:
    Type: String
    Default: ''
    Description: Site public keys as text; empty = SSM parameter
  SiteKeysParameter:
    Type: String
    Default: ''
    AllowedPattern: '^(/[A-Za-z0-9_.-]+)*$'
    Description: SSM parameter with the site public keys
  GpuNodes:
    Type: String
    Default: ''
  OvpnProfileUrl:
    Type: String
    Default: ''
  ManualGpuUrl:
    Type: String
    Default: ''
  ManualBigDataUrl:
    Type: String
    Default: ''
  MessageJobTtlSeconds:
    Type: Number
    Default: 259200
  SiteHeartbeatMinutes:
    Type: Number
    Default: 15
    MinValue: 0
    MaxValue: 1440
    Description: Heartbeat alarm minutes; 0 = off
  QueueWaitMinutes:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1440
    Description: Queue wait alarm minutes

Rules:
  ProvisioningNeedsSettings:
    RuleCondition: !Not [!Equals [!Ref QueuesStack, '']]
    Assertions:
      - Assert: !And
          - !Or
            - !Not [!Equals [!Ref SitePublicKeys, '']]
            - !Not [!Equals [!Ref SiteKeysParameter, '']]
          - !Not [!Equals [!Ref GpuNodes, '']]
          - !Not [!Equals [!Ref OvpnProfileUrl, '']]
          - !Not [!Equals [!Ref ManualGpuUrl, '']]
          - !Not [!Equals [!Ref ManualBigDataUrl, '']]
        AssertDescription: provisioning needs SitePublicKeys or SiteKeysParameter, GpuNodes, OvpnProfileUrl, ManualGpuUrl and ManualBigDataUrl

Conditions:
  HasQueues: !Not [!Equals [!Ref QueuesStack, '']]
  KeysAsText: !And
    - !Condition HasQueues
    - !Not [!Equals [!Ref SitePublicKeys, '']]
  KeysFromSsm: !And
    - !Condition HasQueues
    - !Equals [!Ref SitePublicKeys, '']
  WatchHeartbeat: !And
    - !Condition HasQueues
    - !Not [!Equals [!Ref SiteHeartbeatMinutes, 0]]

Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-provisioning-exec'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-task
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Project}-backend'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${Project}/provisioning:*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - Fn::ImportValue: !Sub '${DataStack}-ProvisioningDbSecretArn'
                  - !If
                    - HasQueues
                    - Fn::ImportValue: !Sub '${QueuesStack}-BackendKeysSecretArn'
                    - !Ref AWS::NoValue
              - !If
                - KeysFromSsm
                - Effect: Allow
                  Action: ssm:GetParameters
                  Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SiteKeysParameter}'
                - !Ref AWS::NoValue
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-provisioning-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource:
                  Fn::ImportValue: !Sub '${EventsStack}-EventBusArn'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${Project}/audit:*'
              - !If
                - HasQueues
                - Effect: Allow
                  Action: sqs:SendMessage
                  Resource:
                    Fn::ImportValue: !Sub '${QueuesStack}-RequestQueueArn'
                - !Ref AWS::NoValue
              - !If
                - HasQueues
                - Effect: Allow
                  Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility]
                  Resource:
                    - Fn::ImportValue: !Sub '${QueuesStack}-ResultQueueArn'
                    - Fn::ImportValue: !Sub '${QueuesStack}-RequestDeadLetterQueueArn'
                    - Fn::ImportValue: !Sub '${QueuesStack}-ResultDeadLetterQueueArn'
                - !Ref AWS::NoValue

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Project}-provisioning'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: provisioning
          Image: !Sub
            - '${Repo}:${ImageTag}'
            - Repo:
                Fn::ImportValue: !Sub '${PlatformStack}-BackendRepositoryUri'
          Essential: true
          Command: [node, src/worker.js]
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: SERVICE_ROLE
              Value: worker
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbHost'
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbPort'
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbName'
            - Name: DB_TLS
              Value:
                Fn::ImportValue: !Sub '${DataStack}-DbTls'
            - Name: FRONTEND_URL
              Value:
                Fn::ImportValue: !Sub '${AppStack}-PublicUrl'
            - Name: STUDENT_EMAIL_DOMAIN
              Value: !Ref StudentEmailDomain
            - Name: STUDENT_ID_DIGITS
              Value: !Ref StudentIdDigits
            - Name: DEGREE_EMAIL_PREFIXES
              Value: !Ref DegreeEmailPrefixes
            - Name: STAFF_EMAIL_DOMAINS
              Value: !Ref StaffEmailDomains
            - Name: APPROVER_EMAILS
              Value: !Ref ApproverEmails
            - Name: SCHEDULER_INTERVAL_SEC
              Value: !Ref SchedulerIntervalSeconds
            - Name: EXPIRY_REMINDER_DAYS
              Value: !Ref ExpiryReminderDays
            - Name: SITE_TIME_ZONE
              Value: !Ref SiteTimeZone
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AUDIT_LOG_GROUP
              Value:
                Fn::ImportValue: !Sub '${LogsStack}-AuditLogGroup'
            - Name: EVENT_BUS_NAME
              Value:
                Fn::ImportValue: !Sub '${EventsStack}-EventBusName'
            - !If
              - HasQueues
              - Name: MESSAGE_TRANSPORT
                Value: sqs
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: SQS_REQUEST_QUEUE_URL
                Value:
                  Fn::ImportValue: !Sub '${QueuesStack}-RequestQueueUrl'
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: SQS_RESULT_QUEUE_URL
                Value:
                  Fn::ImportValue: !Sub '${QueuesStack}-ResultQueueUrl'
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: SQS_REQUEST_DLQ_URL
                Value:
                  Fn::ImportValue: !Sub '${QueuesStack}-RequestDeadLetterQueueUrl'
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: SQS_RESULT_DLQ_URL
                Value:
                  Fn::ImportValue: !Sub '${QueuesStack}-ResultDeadLetterQueueUrl'
              - !Ref AWS::NoValue
            - !If
              - KeysAsText
              - Name: MSG_PEER_PUBLIC_KEYS
                Value: !Ref SitePublicKeys
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MSG_JOB_TTL_SEC
                Value: !Ref MessageJobTtlSeconds
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MSG_MAX_TTL_SEC
                Value: !Ref MessageJobTtlSeconds
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: GPU_NODES
                Value: !Ref GpuNodes
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: OVPN_PROFILE_URL
                Value: !Ref OvpnProfileUrl
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MANUAL_GPU_URL
                Value: !Ref ManualGpuUrl
              - !Ref AWS::NoValue
            - !If
              - HasQueues
              - Name: MANUAL_BIGDATA_URL
                Value: !Ref ManualBigDataUrl
              - !Ref AWS::NoValue
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub
                - '${Arn}:username::'
                - Arn:
                    Fn::ImportValue: !Sub '${DataStack}-ProvisioningDbSecretArn'
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${Arn}:password::'
                - Arn:
                    Fn::ImportValue: !Sub '${DataStack}-ProvisioningDbSecretArn'
            - !If
              - HasQueues
              - Name: MSG_PRIVATE_KEY
                ValueFrom: !Sub
                  - '${Arn}:MSG_PRIVATE_KEY::'
                  - Arn:
                      Fn::ImportValue: !Sub '${QueuesStack}-BackendKeysSecretArn'
              - !Ref AWS::NoValue
            - !If
              - KeysFromSsm
              - Name: MSG_PEER_PUBLIC_KEYS
                ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SiteKeysParameter}'
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${LogsStack}-ProvisioningLogGroup'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: provisioning

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: provisioning
      Cluster:
        Fn::ImportValue: !Sub '${PlatformStack}-ClusterName'
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', {'Fn::ImportValue': !Sub '${NetworkStack}-PublicSubnets'}]
          SecurityGroups:
            - Fn::ImportValue: !Sub '${PlatformStack}-BackendSecurityGroupId'

  ProvisioningErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-provisioning-errors'
      AlarmDescription: Provisioning service logged an error
      Namespace:
        Fn::ImportValue: !Sub '${LogsStack}-MetricNamespace'
      MetricName: ProvisioningErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasQueues
    Properties:
      AlarmName: !Sub '${Project}-dead-letters'
      AlarmDescription: A provisioning job or result reached a dead-letter queue
      Metrics:
        - Id: total
          Expression: requests + results
          ReturnData: true
        - Id: requests
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 300
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions:
                - Name: QueueName
                  Value: !Sub '${Project}-provision-requests-dlq'
        - Id: results
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 300
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions:
                - Name: QueueName
                  Value: !Sub '${Project}-provision-results-dlq'
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]

  SiteHeartbeatFilter:
    Type: AWS::Logs::MetricFilter
    Condition: HasQueues
    Properties:
      LogGroupName:
        Fn::ImportValue: !Sub '${LogsStack}-ProvisioningLogGroup'
      FilterPattern: '{ $.event = "site.heartbeat" }'
      MetricTransformations:
        - MetricNamespace:
            Fn::ImportValue: !Sub '${LogsStack}-MetricNamespace'
          MetricName: SiteHeartbeats
          MetricValue: '1'
  SiteProblemsFilter:
    Type: AWS::Logs::MetricFilter
    Condition: HasQueues
    Properties:
      LogGroupName:
        Fn::ImportValue: !Sub '${LogsStack}-ProvisioningLogGroup'
      FilterPattern: '{ $.event = "site.heartbeat" && $.problems > 0 }'
      MetricTransformations:
        - MetricNamespace:
            Fn::ImportValue: !Sub '${LogsStack}-MetricNamespace'
          MetricName: SiteProblems
          MetricValue: '1'
  SiteHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WatchHeartbeat
    Properties:
      AlarmName: !Sub '${Project}-site-heartbeat-missing'
      AlarmDescription: !Sub 'No site heartbeat for ${SiteHeartbeatMinutes} minutes'
      Namespace:
        Fn::ImportValue: !Sub '${LogsStack}-MetricNamespace'
      MetricName: SiteHeartbeats
      Statistic: Sum
      Period: 60
      EvaluationPeriods: !Ref SiteHeartbeatMinutes
      DatapointsToAlarm: !Ref SiteHeartbeatMinutes
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
      OKActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
  SiteProblemsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WatchHeartbeat
    Properties:
      AlarmName: !Sub '${Project}-site-check-failed'
      AlarmDescription: Site cannot reach pfSense or a node
      Namespace:
        Fn::ImportValue: !Sub '${LogsStack}-MetricNamespace'
      MetricName: SiteProblems
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
  QueueWaitAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasQueues
    Properties:
      AlarmName: !Sub '${Project}-site-not-taking-jobs'
      AlarmDescription: !Sub 'Jobs waited ${QueueWaitMinutes} minutes with none taken'
      Metrics:
        - Id: stuck
          Expression: IF(waiting > 0 AND taken == 0, 1, 0)
          Label: Jobs waiting, none taken
          ReturnData: true
        - Id: waiting
          ReturnData: false
          MetricStat:
            Stat: Maximum
            Period: 60
            Metric:
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions:
                - Name: QueueName
                  Value: !Sub '${Project}-provision-requests'
        - Id: taken
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 60
            Metric:
              Namespace: AWS/SQS
              MetricName: NumberOfMessagesReceived
              Dimensions:
                - Name: QueueName
                  Value: !Sub '${Project}-provision-requests'
      EvaluationPeriods: !Ref QueueWaitMinutes
      DatapointsToAlarm: !Ref QueueWaitMinutes
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]

Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Description: Provisioning task definition
    Value: !Ref TaskDefinition
