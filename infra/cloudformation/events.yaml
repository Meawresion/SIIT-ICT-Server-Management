AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  The event bus between the services and the notification service (D34). The API and provisioning
  services put "Email requested" events on the bus; a rule copies them into the notification
  queue, and the notification Lambda (container image) sends them with the SMTP settings from the
  mail secret, which no other service reads. Deleted with the app between test runs.

Parameters:
  Project:
    Type: String
    Default: siit
  PlatformStack:
    Type: String
  LogsStack:
    Type: String
  NotificationImageTag:
    Type: String
  # Learner Lab: LabRole (D30).
  LambdaRoleArn:
    Type: String
  MailSecretArn:
    Type: String
    Description: The secrets stack's mail secret (SMTP_HOST empty = emails off, only logged)
  AllowedRecipientDomains:
    Type: String
    Description: Comma-separated domains emails may go to (the sign-in domains)
  MaxReceiveCount:
    Type: Number
    Default: 5
    Description: Failed sends of one email before it moves to the dead-letter queue

Resources:
  Bus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${Project}-events'

  NotificationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Project}-notifications-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Project}-notifications'
      MessageRetentionPeriod: 345600
      # At least 6 x the Lambda timeout, as AWS advises for an SQS event source.
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDeadLetterQueue.Arn
        maxReceiveCount: !Ref MaxReceiveCount
  # SQS takes one resource per statement, so each queue has its own policy.
  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref NotificationQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: FromTheBusRule
            Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationQueue.Arn
            Condition:
              ArnEquals: {'aws:SourceArn': !GetAtt EmailRule.Arn}
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 'sqs:*'
            Resource: !GetAtt NotificationQueue.Arn
            Condition:
              Bool: {'aws:SecureTransport': 'false'}
  NotificationDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref NotificationDeadLetterQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 'sqs:*'
            Resource: !GetAtt NotificationDeadLetterQueue.Arn
            Condition:
              Bool: {'aws:SecureTransport': 'false'}

  EmailRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Email requests to the notification service
      EventBusName: !Ref Bus
      EventPattern:
        source: [siit.backend]
        detail-type: [Email requested]
      Targets:
        - Id: notification-queue
          Arn: !GetAtt NotificationQueue.Arn

  NotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Project}-notification'
      Description: Sends the portal's status emails (D34)
      PackageType: Image
      Code:
        ImageUri: !Sub
          - '${Repo}:${NotificationImageTag}'
          - Repo:
              Fn::ImportValue: !Sub '${PlatformStack}-NotificationRepositoryUri'
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 30
      Role: !Ref LambdaRoleArn
      Environment:
        Variables:
          MAIL_SECRET_ARN: !Ref MailSecretArn
          ALLOWED_RECIPIENT_DOMAINS: !Ref AllowedRecipientDomains
      # Its log lines go to the logs stack's group, so they outlive this stack.
      LoggingConfig:
        LogFormat: Text
        LogGroup:
          Fn::ImportValue: !Sub '${LogsStack}-NotificationLogGroup'
  NotificationEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref NotificationFunction
      EventSourceArn: !GetAtt NotificationQueue.Arn
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5
      FunctionResponseTypes: [ReportBatchItemFailures]

  NotificationDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-notification-dead-letters'
      AlarmDescription: A status email could not be sent after several tries (see /siit/notification)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
  NotificationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-notification-errors'
      AlarmDescription: The notification service logged an error (a send failed or its settings are wrong)
      Namespace:
        Fn::ImportValue: !Sub '${LogsStack}-MetricNamespace'
      MetricName: NotificationErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]

Outputs:
  EventBusName:
    Value: !Ref Bus
    Export:
      Name: !Sub '${AWS::StackName}-EventBusName'
  EventBusArn:
    Value: !GetAtt Bus.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EventBusArn'
  NotificationFunctionName:
    Value: !Ref NotificationFunction
