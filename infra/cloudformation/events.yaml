AWSTemplateFormatVersion: '2010-09-09'
Description: 'Event bus, notification queue and the Lambda that sends status emails.'

Parameters:
  Project:
    Type: String
    Default: siit
  PlatformStack:
    Type: String
  LogsStack:
    Type: String
  NotificationImageTag:
    Type: String
  MailSecretArn:
    Type: String
    Description: Mail secret
  AllowedRecipientDomains:
    Type: String
    Description: Allowed recipient domains (comma-separated)
  MaxReceiveCount:
    Type: Number
    Default: 5
    Description: Receives before dead-letter

Resources:
  Bus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${Project}-events'

  NotificationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Project}-notifications-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Project}-notifications'
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDeadLetterQueue.Arn
        maxReceiveCount: !Ref MaxReceiveCount
  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref NotificationQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: FromTheBusRule
            Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationQueue.Arn
            Condition:
              ArnEquals: {'aws:SourceArn': !GetAtt EmailRule.Arn}
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 'sqs:*'
            Resource: !GetAtt NotificationQueue.Arn
            Condition:
              Bool: {'aws:SecureTransport': 'false'}
  NotificationDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref NotificationDeadLetterQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 'sqs:*'
            Resource: !GetAtt NotificationDeadLetterQueue.Arn
            Condition:
              Bool: {'aws:SecureTransport': 'false'}

  EmailRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Email requests to the notification service
      EventBusName: !Ref Bus
      EventPattern:
        source: [siit.backend]
        detail-type: [Email requested]
      Targets:
        - Id: notification-queue
          Arn: !GetAtt NotificationQueue.Arn

  NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-notification-fn'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: send-mail
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt NotificationQueue.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref MailSecretArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${Project}/notification:*'
  NotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Project}-notification'
      Description: Sends status emails
      PackageType: Image
      Code:
        ImageUri: !Sub
          - '${Repo}:${NotificationImageTag}'
          - Repo:
              Fn::ImportValue: !Sub '${PlatformStack}-NotificationRepositoryUri'
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt NotificationRole.Arn
      Environment:
        Variables:
          MAIL_SECRET_ARN: !Ref MailSecretArn
          ALLOWED_RECIPIENT_DOMAINS: !Ref AllowedRecipientDomains
      LoggingConfig:
        LogFormat: Text
        LogGroup:
          Fn::ImportValue: !Sub '${LogsStack}-NotificationLogGroup'
  NotificationEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref NotificationFunction
      EventSourceArn: !GetAtt NotificationQueue.Arn
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5
      FunctionResponseTypes: [ReportBatchItemFailures]

  NotificationDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-notification-dead-letters'
      AlarmDescription: Status email failed
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]
  NotificationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-notification-errors'
      AlarmDescription: Notification service logged an error
      Namespace:
        Fn::ImportValue: !Sub '${LogsStack}-MetricNamespace'
      MetricName: NotificationErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{'Fn::ImportValue': !Sub '${LogsStack}-AlertTopicArn'}]

Outputs:
  EventBusName:
    Value: !Ref Bus
    Export:
      Name: !Sub '${AWS::StackName}-EventBusName'
  EventBusArn:
    Value: !GetAtt Bus.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EventBusArn'
  NotificationFunctionName:
    Value: !Ref NotificationFunction
