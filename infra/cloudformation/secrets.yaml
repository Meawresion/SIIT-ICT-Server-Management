AWSTemplateFormatVersion: '2010-09-09'
Description: 'Secrets Manager secrets for the Google OAuth client and the SMTP mail account.'

Parameters:
  Project:
    Type: String
    Default: siit

Resources:
  GoogleSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Project}/google'
      Description: !Sub '${Project} Google OAuth client'
      SecretString: '{"GOOGLE_CLIENT_ID":"unset.apps.googleusercontent.com","GOOGLE_CLIENT_SECRET":"unset"}'

  MailSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Project}/mail'
      Description: !Sub '${Project} SMTP settings'
      SecretString: '{"SMTP_HOST":"","SMTP_PORT":"465","SMTP_SECURE":"true","SMTP_USER":"","SMTP_APP_PASSWORD":"","MAIL_FROM":"","MAIL_REPLY_TO":""}'

Outputs:
  GoogleSecretArn:
    Value: !Ref GoogleSecret
  MailSecretArn:
    Value: !Ref MailSecret
