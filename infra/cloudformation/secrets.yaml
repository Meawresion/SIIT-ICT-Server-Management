AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  The secrets you provide (D13): the Google OAuth client and the SMTP settings for the status
  emails (S2). CloudFormation creates them with placeholder values, so deleting the stack removes
  them; infra/scripts/set-secrets.sh then puts the real values from your config.env, so they never
  pass through a template, a stack parameter or a command line. With the placeholders the backend
  starts, sign-in can't work and emails are off (the smoke test uses them as they are).

Parameters:
  Project:
    Type: String
    Default: siit

Resources:
  GoogleSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Project}/google'
      Description: !Sub '${Project} Google OAuth client (set-secrets.sh)'
      SecretString: '{"GOOGLE_CLIENT_ID":"unset.apps.googleusercontent.com","GOOGLE_CLIENT_SECRET":"unset"}'

  # Every key the backend reads is present, so ECS can inject each one; SMTP_HOST empty = emails off.
  MailSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Project}/mail'
      Description: !Sub '${Project} SMTP settings for the status emails (set-secrets.sh)'
      SecretString: '{"SMTP_HOST":"","SMTP_PORT":"465","SMTP_SECURE":"true","SMTP_USER":"","SMTP_APP_PASSWORD":"","MAIL_FROM":"","MAIL_REPLY_TO":""}'

Outputs:
  GoogleSecretArn:
    Value: !Ref GoogleSecret
  MailSecretArn:
    Value: !Ref MailSecret
